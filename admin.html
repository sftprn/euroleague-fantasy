<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<title>Feedback admin · EL Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Admin only: mark feedback complete. Not linked from the app; actions need the admin password (checked by the Worker). -->
<style>
  :root{--bg:#0A0A0B;--card:#18181B;--card-2:#232327;--line:#2B2B30;--muted:#9A9AA3;--dim:#5E5E66;--orange:#FF6B1A;--win:#3DDC84}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:#fff;font:400 15px Inter,system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  header a{color:var(--muted);text-decoration:none;font-size:22px;width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:var(--card);border:1px solid var(--line)}
  header h1{font-size:20px;font-weight:800;flex:1}
  header button{border:0;background:none;color:var(--dim);font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
  .seg{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
  .seg button{flex:1;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 14px Inter,system-ui,sans-serif;cursor:pointer}
  .seg button.on{background:var(--orange);color:#fff}
  .list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .fb{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line)}
  .fb:first-child{border-top:0}
  .fb .t{flex:1;min-width:0}
  .fb p{font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  .fb small{display:block;margin-top:5px;font-size:12px;color:var(--dim)}
  .fb.done p{color:var(--muted);text-decoration:line-through;text-decoration-color:#FFFFFF40}
  .fb button{flex:none;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);color:#fff;font:700 13px Inter,system-ui,sans-serif;cursor:pointer}
  .fb button.mark{background:var(--win);border-color:var(--win);color:#06240F}
  .fb button:disabled{opacity:.5}
  .fb .acts{flex:none;width:118px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .fb button.rm{background:none;border-color:transparent;color:var(--dim);font-weight:600}
  .fb button.rm.sure{background:#3D1715;border-color:#FF5A4E;color:#FF5A4E}
  .empty{padding:30px 16px;text-align:center;color:var(--muted)}
  .login{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px}
  .login p{color:var(--muted);font-size:13.5px;margin-bottom:12px}
  .login input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-2);color:#fff;font:500 16px Inter,system-ui,sans-serif;padding:0 14px;outline:none}
  .login input:focus{border-color:var(--orange)}
  .login button{width:100%;height:46px;margin-top:10px;border:0;border-radius:12px;background:var(--orange);color:#fff;font:700 15px Inter,system-ui,sans-serif;cursor:pointer}
  .login .err{color:#FF5A4E;font-size:13px;margin-top:10px;min-height:18px}
</style>
<script>
document.addEventListener("gesturestart", e => e.preventDefault(), {passive: false});
</script>
</head>
<body>
<div class="wrap">
  <header><a href="/1-league" aria-label="Back to the app">‹</a><h1>Feedback admin</h1><button id="out" hidden>Log out</button></header>
  <form class="login" id="login" hidden>
    <p>Admin password — this phone remembers it after the first time.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button type="submit">Open</button>
    <div class="err" id="err"></div>
  </form>
  <div id="main" hidden>
    <div class="seg" id="seg"><button data-f="open" class="on">Open</button><button data-f="done">Completed</button><button data-f="all">All</button></div>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = "elf.adminPw";
const getPw = () => { try{ return localStorage.getItem(KEY) || ""; }catch{ return ""; } };
const setPw = v => { try{ v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); }catch{} };
let pw = getPw(), items = [], filter = "open";
const when = t => new Date(t).toLocaleString("en-GB", {day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"});

async function login(p){
  const r = await fetch("/api/feedback/login", {method: "POST", headers: {"x-admin": p}});
  return r.ok;
}
async function load(){
  const r = await fetch("/api/feedback", {cache: "no-store"});
  items = r.ok ? (await r.json()).items || [] : [];
  render();
}
function render(){
  document.querySelectorAll("#seg [data-f]").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
  const list = items.filter(f => filter === "all" || (filter === "done") === f.done);
  $("#list").innerHTML = list.length ? list.map(f => `<div class="fb${f.done ? " done" : ""}">
      <div class="t"><p>${esc(f.text)}</p><small>${esc(when(f.at))}${f.done && f.doneAt ? ` · completed ${esc(when(f.doneAt))}` : ""}</small></div>
      <div class="acts"><button data-id="${f.id}" data-done="${f.done ? 0 : 1}" class="${f.done ? "" : "mark"}">${f.done ? "Reopen" : "Complete"}</button>
      <button data-rm="${f.id}" class="rm">Remove</button></div></div>`).join("")
    : `<div class="empty">${filter === "open" ? "Nothing open — all done." : filter === "done" ? "Nothing completed yet." : "No feedback yet."}</div>`;
}
function show(ok){
  $("#login").hidden = ok; $("#main").hidden = !ok; $("#out").hidden = !ok;
  if (ok) load(); else setTimeout(() => $("#pw").focus(), 50);
}
$("#login").addEventListener("submit", async e => {
  e.preventDefault();
  const p = $("#pw").value; if (!p) return;
  $("#err").textContent = "";
  if (await login(p)){ pw = p; setPw(p); $("#pw").value = ""; show(true); }
  else $("#err").textContent = "Wrong password.";
});
$("#out").onclick = () => { pw = ""; setPw(""); show(false); };
$("#seg").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b){ filter = b.dataset.f; render(); } });
$("#list").addEventListener("click", async e => {
  const rm = e.target.closest("button[data-rm]");
  if (rm){                                            // first tap asks, second tap removes
    if (!rm.classList.contains("sure")){
      document.querySelectorAll("button.rm.sure").forEach(x => { x.classList.remove("sure"); x.textContent = "Remove"; });
      rm.classList.add("sure"); rm.textContent = "Tap to remove";
      clearTimeout(rm._t); rm._t = setTimeout(() => { rm.classList.remove("sure"); rm.textContent = "Remove"; }, 4000);
      return;
    }
    rm.disabled = true;
    const r = await fetch("/api/feedback/delete", {method: "POST", headers: {"content-type": "application/json", "x-admin": pw}, body: JSON.stringify({id: +rm.dataset.rm})});
    if (r.status === 401){ pw = ""; setPw(""); show(false); $("#err").textContent = "Please log in again."; return; }
    if (r.ok){ items = items.filter(x => x.id !== +rm.dataset.rm); render(); } else rm.disabled = false;
    return;
  }
  const b = e.target.closest("button[data-id]"); if (!b) return;
  b.disabled = true;
  const r = await fetch("/api/feedback/done", {method: "POST", headers: {"content-type": "application/json", "x-admin": pw}, body: JSON.stringify({id: +b.dataset.id, done: b.dataset.done === "1"})});
  if (r.status === 401){ pw = ""; setPw(""); show(false); $("#err").textContent = "Please log in again."; return; }
  if (r.ok){ const f = items.find(x => x.id === +b.dataset.id); if (f){ f.done = b.dataset.done === "1"; f.doneAt = f.done ? Date.now() : null; } render(); }
  else b.disabled = false;
});
(async () => { show(pw ? await login(pw).catch(() => false) : false); })();
</script>
</body>
</html>
