<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EL Fantasy</title>
<!-- App shell (served by the "fantasy" Worker: https://fantasy.eurolyga.workers.dev).
     Keeps the bottom bar on screen and shows Teams (2-coach) and Games / Players (1-league) in frames underneath it,
     so switching never reloads the bar. Both sections stay loaded; the hidden one pauses its live updates. -->
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EL Fantasy">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000000;touch-action:manipulation;-webkit-text-size-adjust:100%}
  iframe{position:fixed;top:0;left:0;width:100%;height:var(--appH, 100%);border:0;display:block;background:transparent;z-index:1}
  /* the background artwork, drawn once here behind both sections (they're see-through), so it never moves when switching */
  .art{position:fixed;left:0;right:0;top:0;height:300px;z-index:0;pointer-events:none;background-color:#000;
       background-image:linear-gradient(180deg,#00000026 0px,#0000008C 140px,#000000E6 230px,#000000 300px), url("/assets/bg.jpg");
       background-size:100% 300px, max(100vw, 520px) auto;background-position:center top, center -30px;background-repeat:no-repeat}
  iframe.off{visibility:hidden;pointer-events:none;z-index:0}           /* kept loaded (and scrolled where you left it), just not shown */
  /* switching sections: the new page cross-fades in on top (both have the same artwork in the same place, so the
     background stays still) while each page slides its own content sideways, in the bar's order (embed.js "slide") */
  /* sections switch instantly (same artwork in both, so nothing seems to change but the content, which slides in a little) */
  iframe.top{z-index:2}
  iframe.enter{transition:none}
  #probe{position:fixed;left:0;top:0;width:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
</style>
<script>document.addEventListener("gesturestart", e => e.preventDefault(), {passive: false});</script>
</head>
<body>
<div class="art" aria-hidden="true"></div>
<div id="probe"></div>
<script src="/assets/nav.js"></script>
<script>
(function(){
  if (location.protocol === "file:"){ location.replace("2-coach.html?coach=league"); return; }
  // iPhone home-screen app: iOS can lay the page out shorter than the screen (about the status bar's height) and change
  // that while the app runs, which leaves an empty strip under the bottom bar. So in the home-screen app nothing here
  // depends on that height: the sections are sized to the real screen and the bar is placed from the top (--appH).
  const APP = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  function fitScreen(){
    // The height iOS really gives the app (innerHeight, in CSS px, so Safari's page zoom and Display Zoom are already in it).
    // Earlier tries used screen.height, but with a see-through status bar iOS shortens the app by the bar's height at the
    // bottom and nothing can be drawn there, so the status bar is now solid black (meta tag above) and the app fills the rest.
    const full = Math.round(window.visualViewport ? Math.max(innerHeight, visualViewport.height) : innerHeight);
    document.documentElement.style.setProperty("--appH", full + "px");
    const nav = document.getElementById("elfNav");
    if (nav){ nav.style.bottom = "auto"; nav.style.top = (full - nav.offsetHeight) + "px"; }
  }
  addEventListener("resize", fitScreen); addEventListener("orientationchange", () => setTimeout(fitScreen, 300));
  addEventListener("load", fitScreen); setTimeout(fitScreen, 400); setTimeout(fitScreen, 1500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(fitScreen, 100); });
  const TABS = ["teams", "games", "players"];
  const q = new URLSearchParams(location.search);
  const demo = q.has("demo") ? "&demo" + (q.get("demo") ? "=" + q.get("demo") : "") : "";
  let tab = !APP && TABS.includes(q.get("tab")) ? q.get("tab") : "teams";          // the home-screen app always opens on Teams
  let fresh = q.has("new");                               // demo "start over": only the first section loaded wipes the pretend league
  const frames = {};
  function frame(sec){                                    // sec: "teams" | "league"
    if (frames[sec]) return frames[sec];
    const f = document.createElement("iframe");
    f.title = sec === "teams" ? "Teams" : "Games and players";
    const extra = demo + (fresh ? "&new" : ""); fresh = false;
    f.src = sec === "teams" ? `/2-coach?coach=${encodeURIComponent(q.get("coach") || "league")}&embed${extra}`
                            : `/1-league?view=${tab === "players" ? "players" : "games"}&embed${extra}`;
    f.className = "off";
    document.body.insertBefore(f, document.getElementById("probe"));
    return frames[sec] = f;
  }
  const secOf = t => t === "teams" ? "teams" : "league";
  const post = (sec, msg) => { try{ frames[sec]?.contentWindow?.postMessage(msg, location.origin); }catch{} };
  function insets(){
    const p = getComputedStyle(document.getElementById("probe"));
    const m = {elf: "insets", top: parseFloat(p.paddingTop) || 0, bottom: parseFloat(p.paddingBottom) || 0};
    post("teams", m); post("league", m);
  }
  let xfade = 0;
  function show(t){
    const from = tab;
    tab = t;
    const sec = secOf(t);
    frame(sec);
    clearTimeout(xfade);
    const f = frames[sec], prev = Object.keys(frames).find(k => k !== sec && !frames[k].classList.contains("off"));
    for (const k in frames){ frames[k].classList.remove("top", "enter"); frames[k].style.transform = frames[k].style.opacity = ""; }
    if (prev && f.classList.contains("off")){             // slide: old out to one side, new in from the other
      const dir = TABS.indexOf(t) > TABS.indexOf(from) ? 1 : -1, old = frames[prev];
      post(sec, {elf: "slide", dir, enter: true});         // the new page's content slides in from that side
      f.classList.add("top"); f.classList.remove("off");
      xfade = setTimeout(() => { old.classList.add("off"); f.classList.remove("top"); }, 30);
    } else for (const k in frames) frames[k].classList.toggle("off", k !== sec);
    for (const k in frames) post(k, {elf: "show", on: k === sec});
    document.getElementById("elfNav")?.classList.remove("cover");
    if (sec === "league") post("league", {elf: "view", view: t});
    document.title = t === "teams" ? "Teams · EL Fantasy" : t === "games" ? "Games · EL Fantasy" : "Players · EL Fantasy";
    const u = new URL(location.href); ["tab", "new", "coach"].forEach(k => u.searchParams.delete(k));   // keep the address plain, so the app reopens on Teams
    history.replaceState(null, "", u.pathname + u.search.replace(/demo=(&|$)/, "demo$1"));
    fitScreen();
  }
  addEventListener("message", e => {                      // a section finished loading: give it the safe areas and tell it if it's shown
    if (e.origin !== location.origin) return;
    if (e.data?.elf === "cover"){                         // a bottom sheet opened / closed in the shown section: bar out of the way / back
      const shown = frames[secOf(tab)]; if (!shown || shown.contentWindow === e.source) document.getElementById("elfNav")?.classList.toggle("cover", !!e.data.on);
      return;
    }
    if (e.data?.elf !== "ready") return;
    insets();
    for (const k in frames) if (frames[k].contentWindow === e.source){
      post(k, {elf: "show", on: k === secOf(tab)});
      if (k === "league" && tab !== "teams") post("league", {elf: "view", view: tab});
    }
  });
  addEventListener("resize", insets);
  Nav.init({active: tab, onTap: k => {
    if (k === tab){ k === "teams" ? post("teams", {elf: "teams-top"}) : post("league", {elf: "view", view: k}); return true; }   // same tab: back to its top
    show(k);
    return true;
  }});
  show(tab);
  fitScreen();
  // load the other section in the background, so the first switch is instant too
  setTimeout(() => { frame(secOf(tab) === "teams" ? "league" : "teams"); for (const k in frames) frames[k].classList.toggle("off", k !== secOf(tab)); }, 2500);
})();
</script>
</body></html>
