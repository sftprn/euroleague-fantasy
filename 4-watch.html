<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<!-- home-screen app: stay full-screen when moving between pages (iOS + Android) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EL Fantasy">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<title>Watch team · EL Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --card:#18181B; --card-2:#232327; --line:#2B2B30; --text:#FFFFFF; --muted:#9A9AA3; --dim:#5E5E66;
    --orange:#FF6B1A; --win:#3DDC84; --win-soft:#123B2A; --loss:#FF5A4E; --loss-soft:#3D1715;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .titles{flex:1;min-width:0}
  header h1{font-weight:800;font-size:19px;letter-spacing:.02em;line-height:1}
  header small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px;letter-spacing:.04em}
  .icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:22px;display:grid;place-items:center;cursor:pointer;flex:none;font-family:inherit}
  .icon-btn.on{background:var(--orange);border-color:var(--orange);font-size:20px;font-weight:800}
  .private{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:10px 2px 14px}
  .private svg{flex:none}
  .sum{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
  .sum b{font-size:24px;font-weight:800} .sum small{color:var(--muted);font-size:12.5px}

  .list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .p{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);position:relative}
  .p:first-child{border-top:0}
  .p.live{background:linear-gradient(90deg,#FF6B1A1F,transparent 75%)}
  .p.live::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
  .ph{width:46px;height:46px;border-radius:50%;background:var(--card-2);flex:none;overflow:hidden;position:relative;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
  .who{flex:1;min-width:0}
  .who b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{margin-top:3px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
  .tv{font-weight:700;color:#C9C9CF}
  .res{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.03em}
  .res.W{background:var(--win-soft);color:var(--win)} .res.L{background:var(--loss-soft);color:var(--loss)} .res.D{background:var(--card-2);color:var(--muted)}
  .lchip{display:inline-flex;align-items:center;gap:4px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.03em}
  .lchip i{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .score{font-weight:700;color:#fff}
  .val{min-width:52px;text-align:right;font-size:20px;font-weight:800}
  .p.live .val{color:var(--orange)}
  .p.up .val,.p.soon .val,.p.none .val{color:var(--dim);font-weight:700}
  .rm{width:34px;height:34px;border-radius:11px;border:0;background:var(--loss-soft);color:var(--loss);font-size:15px;font-weight:800;flex:none;cursor:pointer}
  .addrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;color:var(--dim);font-weight:600}
  .p + .addrow,.addrow:first-child{border-top:1px solid var(--line)}
  .addrow:first-child{border-top:0}
  .addrow .ph{background:transparent;border:1.5px dashed #46464D;color:var(--orange);font-size:22px;font-weight:500}
  .hint{font-size:12px;color:var(--dim);padding:12px 4px 0;line-height:1.45}

  /* finder (same look as the coach page) */
  .finder{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility .25s}
  .finder.open{transform:none;visibility:visible}
  .finder-in{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100%;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
  .s-row{display:flex;gap:10px;align-items:center;width:100%}
  .searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:50px;border:1.5px solid var(--line);border-radius:15px;padding:0 14px;background:var(--card)}
  .searchbox:focus-within{border-color:var(--orange)}
  .searchbox svg{flex:none;color:var(--muted)}
  .searchbox input{flex:1;min-width:0;border:0;background:none;font:500 16px Inter,system-ui,sans-serif;color:#fff;height:100%}
  .searchbox input::placeholder{color:var(--dim)}
  .searchbox input:focus{outline:none}
  .searchbox input::-webkit-search-cancel-button{display:none}
  .close{width:50px;height:50px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:22px;cursor:pointer;flex:none}
  .s-sub{font-size:12.5px;color:var(--muted);padding:12px 4px 4px}
  .results{flex:1;overflow-y:auto;margin:0 -16px;padding:0 16px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .r{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .r:active{background:#141417}
  .r .crest{width:16px;height:16px;object-fit:contain;vertical-align:-3px}
  .r .add{width:38px;height:38px;border-radius:12px;border:0;background:var(--orange);color:#fff;font-size:22px;font-weight:500;flex:none;cursor:pointer}
  .r.taken .add{background:var(--card-2);color:var(--muted);font-size:15px}
  .r-hint{padding:40px 10px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#fff;color:#000;font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:40}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="icon-btn" id="backBtn" href="/1-league" aria-label="Back">‹</a>
    <div class="titles"><h1>WATCH TEAM</h1><small id="sub">ROUND –</small></div>
    <button class="icon-btn" id="editBtn" aria-label="Remove players">✎</button>
  </header>
  <div class="private">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    Only on this phone. Friends never see it, and it doesn't count in the standings.
  </div>
  <div class="sum" id="sum" hidden></div>
  <div class="list" id="list"></div>
  <p class="hint">Follow any Euroleague players here. PIR is the raw value while live, then ±10% for the team result, like everywhere else. No groups, captains or wild cards.</p>
</div>

<div class="finder" id="finder" role="dialog" aria-label="Add player">
  <div class="finder-in">
    <div class="s-row">
      <label class="searchbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search player or team" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </label>
      <button class="close" id="closeFinder" aria-label="Close">✕</button>
    </div>
    <div class="s-sub" id="count"></div>
    <div class="results" id="results"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/demo.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/data.js"></script>
<script>
/* Watch team: any players, followed privately. Stored ONLY in this phone's localStorage (elf.watch);
   nothing is ever sent to /api/state. Shared data is only read (for the league's current round). */
const MAX = 20;
const today = new Date();
const SEASON = "E" + (today.getMonth() >= 6 ? today.getFullYear() : today.getFullYear() - 1);
const DIRECT = location.protocol === "file:";
const V2 = `${DIRECT ? "https://api-live.euroleague.net" : "/el-api"}/v2/competitions/E/seasons/${SEASON}`;
if (DIRECT) document.getElementById("backBtn").href = "1-league.html";
const LIVE_POLL = window.ELF_DEMO ? 5_000 : 30_000, IDLE_POLL = 5 * 60_000;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const r1 = v => Math.round(v * 100) / 100;
const fmtShort = v => r1(v).toFixed(1);
const adjustPir = (raw, win) => r1(raw + (win ? 1 : -1) * Math.abs(raw) * 0.1);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
async function getJSON(url){
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function cached(key, ttl, loader){
  const c = store.get(key);
  if (c && Date.now() - c.t < ttl) return c.v;
  try{ const v = await loader(); store.set(key, {t: Date.now(), v}); return v; }
  catch(e){ if (c) return c.v; throw e; }
}
const niceName = s => String(s || "").split(",").map(x => x.trim()).reverse().join(" ").toLowerCase().replace(/(^|[\s'-])\p{L}/gu, c => c.toUpperCase());
// same caches as the coach page, so this opens instantly after visiting it
const loadPeople = () => cached(`elf.people.${SEASON}`, 12 * 3600e3, async () => {
  const d = (await getJSON(`${V2}/people?personType=J`)).data;
  const m = new Map();
  d.filter(x => x.active).forEach(x => m.set(x.person.code, {
    code: x.person.code, name: niceName(x.person.name),
    club: x.club.code, tv: x.club.tvCode || x.club.code, clubName: x.club.editorialName || x.club.name,
    crest: x.club.images?.crest || "", img: x.images?.headshot || "", pos: (x.positionName || "–").charAt(0)
  }));
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name));
});
const loadGames = () => cached(`elf.games.${SEASON}`, 10 * 60e3, async () => {
  const d = (await getJSON(`${V2}/games`)).data;
  const side = s => ({c: s.club.code, tv: s.club.tvCode || s.club.code});
  return d.map(x => ({c: x.gameCode, r: x.round, u: x.utcDate, p: x.played, h: side(x.local), a: side(x.road)}));
});

let watch = store.get("elf.watch", []);           // [{code, name, club, tv, clubName, img, pos}]
let people = [], games = [], round = null, box = {}, timer = 0, editing = false;
const save = () => store.set("elf.watch", watch);

/* state of one player this round (same rules as the coach page, without groups/captain) */
function stateOf(p){
  const g = games.find(g => g.r === round && (g.h.c === p.club || g.a.c === p.club));
  if (!g) return {kind: "none"};
  const home = g.h.c === p.club, opp = home ? g.a : g.h;
  const b = box[g.c];
  if (new Date(g.u) > new Date()) return {kind: "up", g, opp, home};
  if (!b || b.pending) return {kind: "soon", g, opp, home};
  const ti = b.teams[0].pl[p.code] ? 0 : b.teams[1].pl[p.code] ? 1 : (home ? 0 : 1);
  const me = b.teams[ti], them = b.teams[1 - ti], st = me.pl[p.code];
  const dnp = !st || st.min === "DNP" || !st.mins;
  const raw = dnp ? 0 : st.pir, win = me.pts > them.pts;
  return {kind: b.live ? "live" : "final", g, opp, home, dnp, win, raw, val: b.live ? raw : adjustPir(raw, win),
          score: `${me.pts}–${them.pts}`, q: b.q, t: b.t};
}
const when = u => new Date(u).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"});
const photo = p => `<div class="ph">${esc((p.name || "").split(" ").map(w => w[0]).slice(0, 2).join(""))}${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;
function subline(p, s){
  const tv = `<span class="tv">${esc(p.tv)}</span>`;
  const q = String(s.q || "").replace(/\D/g, "");
  switch (s.kind){
    case "live":  return `${tv} <span class="lchip"><i></i>${q ? (+q > 4 ? "OT" : "Q" + q) : "LIVE"}${s.t && s.t !== "00:00" ? " " + esc(s.t.replace(/^0/, "")) : ""}</span> <span class="score">${s.score}</span>`;
    case "final": return s.dnp ? `${tv} <span class="res D">DNP</span>` : `${tv} <span class="res ${s.win ? "W" : "L"}">${s.win ? "W +10%" : "L −10%"}</span> ${s.score}`;
    case "soon":  return `${tv} · ${s.home ? "vs" : "@"} ${esc(s.opp.tv)} · starting`;
    case "up":    return `${tv} · ${s.home ? "vs" : "@"} ${esc(s.opp.tv)} · ${esc(when(s.g.u))}`;
    default:      return `${tv} · no game this round`;
  }
}

function render(){
  $("#sub").textContent = `${SEASON.slice(1)}–${(+SEASON.slice(3) + 1) % 100} · ROUND ${round ?? "–"}`;
  const rows = watch.map((p, i) => ({p, i, s: games.length ? stateOf(p) : {kind: "none"}}));
  const has = r => r.s.kind === "live" || r.s.kind === "final";
  rows.sort((a, b) => (has(b) - has(a)) || (has(a) ? b.s.val - a.s.val : a.i - b.i));   // with PIR first (by PIR), then in the order added
  const counted = rows.filter(has), live = rows.some(r => r.s.kind === "live");
  $("#sum").hidden = !watch.length;
  $("#sum").innerHTML = `<b>${fmtShort(counted.reduce((t, r) => t + r.s.val, 0))} PIR</b><small>${live ? "live · " : ""}${counted.filter(r => !r.s.dnp).length} of ${watch.length} played · max ${MAX}</small>`;
  $("#list").innerHTML = rows.map(({p, s}) => `<div class="p ${s.kind}" data-code="${esc(p.code)}">
      ${photo(p)}<div class="who"><b>${esc(p.name)}</b><small>${subline(p, s)}</small></div>
      ${editing ? `<button class="rm" data-rm="${esc(p.code)}" aria-label="Remove ${esc(p.name)}">✕</button>`
                : `<div class="val">${has({s}) ? fmtShort(s.val) : "–"}</div>`}
    </div>`).join("") + (watch.length < MAX ? `<div class="addrow" id="addRow"><div class="ph">+</div>Add player</div>` : "");
}

async function refresh(){
  clearTimeout(timer);
  const clubs = new Set(watch.map(p => p.club));
  const need = games.filter(g => g.r === round && (clubs.has(g.h.c) || clubs.has(g.a.c)) && new Date(g.u) <= new Date());
  await Promise.all(need.map(g => ElData.box(g.c).then(b => { box[g.c] = b; }).catch(() => {})));
  render();
  if (document.hidden) return;
  const now = Date.now(), rel = games.filter(g => g.r === round && (clubs.has(g.h.c) || clubs.has(g.a.c)));
  const inPlay = rel.some(g => new Date(g.u) <= now && !(box[g.c] && box[g.c].final));
  const next = rel.map(g => +new Date(g.u)).filter(t => t > now).sort((a, b) => a - b)[0];
  timer = setTimeout(refresh, inPlay ? LIVE_POLL : next ? Math.min(IDLE_POLL, Math.max(10_000, next - now + 5_000)) : IDLE_POLL);
}
document.addEventListener("visibilitychange", () => document.hidden ? clearTimeout(timer) : refresh());

/* ───────── add / remove ───────── */
const finder = $("#finder");
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
function openFinder(){
  if (watch.length >= MAX){ toast(`Watch team is full (${MAX})`); return; }
  finder.classList.add("open"); renderResults(); setTimeout(() => $("#q").focus(), 260);
}
function renderResults(){
  $("#count").textContent = `${watch.length}/${MAX} watched`;
  const q = norm($("#q").value.trim()), out = $("#results");
  if (!people.length){ out.innerHTML = `<div class="r-hint">Loading Euroleague players…</div>`; return; }
  if (q.length < 2){ out.innerHTML = `<div class="r-hint">Type a player name or team.<br>Any player, including ones on someone's fantasy roster.</div>`; return; }
  const mine = new Set(watch.map(p => p.code));
  const hits = people.filter(p => norm(p.name).includes(q) || norm(p.clubName).includes(q) || norm(p.tv) === q || norm(p.club) === q).slice(0, 60);
  out.innerHTML = hits.map(p => `<div class="r ${mine.has(p.code) ? "taken" : ""}" data-code="${esc(p.code)}">
      ${photo(p)}<div class="who"><b>${esc(p.name)}</b><small>${p.crest ? `<img class="crest" src="${esc(p.crest)}" alt="">` : ""}<span class="tv">${esc(p.tv)}</span> ${esc(p.clubName)} · ${esc(p.pos)}</small></div>
      <button class="add" aria-label="${mine.has(p.code) ? "Remove" : "Add"}">${mine.has(p.code) ? "✓" : "+"}</button></div>`).join("")
    || `<div class="r-hint">No players match “${esc($("#q").value)}”.</div>`;
}
$("#q").addEventListener("input", renderResults);
$("#closeFinder").onclick = () => { finder.classList.remove("open"); $("#q").blur(); };
$("#results").addEventListener("click", e => {
  const r = e.target.closest(".r"); if (!r) return;
  const code = r.dataset.code, i = watch.findIndex(p => p.code === code);
  if (i >= 0){ const [p] = watch.splice(i, 1); toast(`${p.name} removed`); }             // tap again to take him off
  else {
    if (watch.length >= MAX){ toast(`Watch team is full (${MAX})`); return; }
    const p = people.find(x => x.code === code);
    watch.push({code: p.code, name: p.name, club: p.club, tv: p.tv, clubName: p.clubName, img: p.img, pos: p.pos});
    toast(`${p.name} added`);
  }
  save(); renderResults(); refresh();
});
$("#list").addEventListener("click", e => {
  if (e.target.closest("#addRow")){ openFinder(); return; }
  const rm = e.target.closest("[data-rm]");
  if (rm){ watch = watch.filter(p => p.code !== rm.dataset.rm); save(); render(); }
});
$("#editBtn").onclick = () => {
  editing = !editing;
  $("#editBtn").classList.toggle("on", editing);
  $("#editBtn").textContent = editing ? "✓" : "✎";
  render();
};
// other tabs/pages on this phone changed the list
addEventListener("storage", e => { if (e.key && e.key.endsWith("watch")){ watch = store.get("elf.watch", []); render(); } });
Shared.on(() => { if (Shared.league?.round && games.length && round !== Shared.league.round){ round = Shared.league.round; refresh(); } });

(async function boot(){
  render();
  Shared.start();                                   // read-only here: only the league's round is used
  try{
    const [g, ppl] = await Promise.all([loadGames(), loadPeople().catch(() => [])]);
    games = g; people = ppl;
    // refresh stored player details (club changes, new photos)
    const byCode = new Map(people.map(p => [p.code, p]));
    watch = watch.map(w => { const p = byCode.get(w.code); return p ? {code: p.code, name: p.name, club: p.club, tv: p.tv, clubName: p.clubName, img: p.img, pos: p.pos} : w; });
    save();
    const st = games.filter(g => new Date(g.u) <= new Date());
    round = Shared.league?.round ?? (st.length ? Math.max(...st.map(g => g.r)) : Math.min(...games.map(g => g.r)));
  }catch{ $("#list").innerHTML = `<div class="addrow">Couldn't reach the Euroleague API.</div>`; return; }
  refresh();
})();
</script>
</body>
</html>
