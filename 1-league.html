<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<!-- home-screen app: stay full-screen when moving between pages (iOS + Android) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EL Fantasy">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<title>League · EL Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --card:#18181B; --card-2:#232327; --line:#2B2B30; --text:#FFFFFF; --muted:#9A9AA3; --dim:#5E5E66;
    --orange:#FF6B1A; --win:#3DDC84;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  /* the page itself never scrolls (so iOS can't bounce the top bar along); the lists scroll in .scroller, as on Teams */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:var(--bg)}
  .scroller{position:fixed;left:0;right:0;top:var(--listTop, 88px);bottom:var(--navH, 0px);z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;font-variant-numeric:tabular-nums}
  .app{max-width:480px;margin:0 auto;padding:12px 16px 16px;position:relative}   /* the 12 px gap under the controls is inside the scroll area, so content can scroll right up to them */
  /* header: the same as on Teams — art backdrop, title + subtitle on the left; content scrolls under it */
  .art{background-color:var(--bg);
       background-image:linear-gradient(180deg,#00000026 0px,#0000008C 140px,#000000E6 230px,#000000 300px), url("assets/bg.jpg");
       background-size:100% 300px, max(100vw, 520px) auto;background-position:center top, center -30px;background-repeat:no-repeat}
  .art{position:fixed;left:0;right:0;top:0;height:300px;z-index:0;pointer-events:none}
  .top{position:fixed;left:0;right:0;top:0;z-index:4;padding:calc(12px + var(--sat, env(safe-area-inset-top))) 16px 14px;margin:0}   /* nothing scrolls under it: no artwork copy, no fade */
  .ctrl{position:fixed;left:0;right:0;top:var(--headH, 76px);z-index:3;padding:0 16px}
  .ctrl > *{max-width:448px;margin:0 auto !important}
  .ctrl > [hidden]{display:none !important}
  .top .bar{max-width:448px;margin:0 auto;display:flex;align-items:center;min-height:44px}
  .top .title{text-align:left;min-width:0;flex:1;padding:0;min-height:50px;display:flex;flex-direction:column;justify-content:center}   /* as tall as Teams' title + dots; a lone headline sits in the middle */
  .top .meta:empty{display:none}
  .top .title h1{font-size:24px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:normal}
  .top .meta{margin-top:4px;font-size:13px;font-weight:600;color:#FFFFFFB3;display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:1.3em}   /* kept even when empty: same header height as Teams */

  /* header */
  .logo{width:40px;height:40px;flex:none;display:block}
  .titles{flex:1;min-width:0}
  .icon-btn{width:42px;height:42px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;flex:none;font-family:inherit}
  .icon-btn.on{background:var(--orange);border-color:var(--orange);font-size:20px;font-weight:800}

  /* standings */
  .list{background:#000000A6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;overflow:hidden;border:1px solid #FFFFFF22}   /* lists: the same see-through glass and corners as the tab groups and round picker */
  .row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .row:first-child{border-top:0}
  .row:active{background:#1F1F23}
  .rank{width:24px;font-weight:800;font-size:18px;color:var(--dim);text-align:center;flex:none}

  /* 1st place: hero row with the background art */
  .row.lead{position:relative;align-items:center;min-height:72px;padding:14px 16px;
            background:url("assets/bg.jpg") center 35%/cover}
  .row.lead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000001A 0%,#00000080 55%,#000000E6 100%)}
  .row.lead > *{position:relative;z-index:1}
  .row.lead .rank{color:var(--orange)}
  .row.lead .lbl{display:block;font-size:10.5px;letter-spacing:.14em;color:#FFFFFFB3;font-weight:700;margin-bottom:4px}
  .row.lead .chev{color:#FFFFFF99}
  .row.lead .live-dot{vertical-align:middle;margin-right:4px}
  .row.lead.editing{min-height:0;align-items:center}
  .row.editing .who b{font-size:16px}
  .who{flex:1;min-width:0}
  .who b{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .score{font-size:21px;font-weight:800;text-align:right;flex:none;display:flex;align-items:center;gap:8px}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);animation:pulse 1.4s infinite}
  .chev{color:var(--dim);font-size:20px;margin-left:2px}
  .team-input{width:100%;height:42px;border:1.5px solid var(--line);border-radius:16px;background:var(--card-2);color:#fff;
              font:700 16px Inter,system-ui,sans-serif;padding:0 12px}
  .team-input:focus{outline:none;border-color:var(--orange)}
  /* Start Round X — appears when every game of the round is over; 2 phones start the next round */
  .start{margin:-2px 0 14px}
  .start-btn{width:100%;height:48px;border:0;border-radius:16px;background:var(--orange);color:#fff;font:800 16px Inter,system-ui,sans-serif;
             letter-spacing:.3px;cursor:pointer;box-shadow:0 6px 20px #FF6B1A33;display:flex;align-items:center;justify-content:center;gap:10px;
             transition:transform .1s,background .15s,box-shadow .15s}
  .start-btn:active{transform:scale(.98)}
  .start-btn.voted{background:var(--card);border:2px solid var(--orange);color:var(--orange);box-shadow:none}
  .start-btn:disabled{opacity:.6}
  .start-note{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-top:8px}
  .seg{height:44px;box-sizing:border-box;display:flex;gap:4px;padding:3px;border-radius:16px;border:1px solid #FFFFFF22;background:#00000080;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:12px}
  .seg button{flex:1;height:36px;border:0;border-radius:13px;background:transparent;color:#FFFFFF99;font:700 14px Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s,color .15s}
  .seg button.on{background:#FFFFFF24;color:#fff}
  /* Teams table: rank · team · ROUND │ TOTAL */
  .tbl .th{display:flex;align-items:center;gap:14px;padding:10px 16px 8px;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--dim);border-bottom:1px solid var(--line)}
  .tbl .th .who{font-size:10.5px}
  .tbl .th button{all:unset;cursor:pointer;color:var(--dim);white-space:nowrap} .tbl .th button.on{color:#fff}
  .tbl .th button.on::after{content:" ▾"}
  .tbl .th + .row{border-top:0}
  .tbl .row,.tbl .th{gap:10px}
  .tbl .who b{font-size:15.5px}
  .c-rd{width:52px;text-align:right;flex:none;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:flex-end;position:relative}
  .c-rd .live-dot{position:absolute;left:-6px;top:50%;margin-top:-3.5px}
  .c-tot{width:70px;text-align:right;flex:none;font-size:15px;font-weight:700;color:#C9C9CF;align-self:stretch;display:flex;align-items:center;justify-content:flex-end;
         border-left:1px solid var(--line);margin:-15px 0;padding:15px 0}
  .th .c-rd,.th .c-tot{font-size:10.5px;font-weight:800;color:var(--dim);margin:-10px 0 -8px;padding:10px 0 8px}
  .row.lead .c-tot{border-left-color:#FFFFFF33;color:#FFFFFFD9;margin:-14px 0;padding:14px 0}
  .tbl .row.editing .base-input{width:92px}
  /* live games */
  .lg{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
  .lg:first-child{border-top:0}
  /* list headers (Games days, Watchlist, Top Performers — and the same on Teams): one height, one type style, one line,
     in the lighter glass of the 1st place on the Teams table */
  .day-h,.wl .gh,.lh{display:flex;align-items:center;gap:8px;height:44px;min-height:44px;box-sizing:border-box;padding:0 16px;background:#FFFFFF14;border-bottom:1px solid var(--line);
    font:700 14px/1 Inter,system-ui,sans-serif;letter-spacing:.01em;color:#fff;text-transform:none;white-space:nowrap;overflow:hidden}
  .day-h .lt,.wl .gh .lt,.lh .lt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}   /* one line; cut off with … when it doesn't fit */
  .day-h .lx,.wl .gh .lx,.lh .lx{color:#FFFFFFB3}
  .day-h .lt,.wl .gh .lt{flex:1 1 auto}             /* Games days, Watchlist: title on the left, count on the right */
  .day-h > .lx,.wl .gh > .lx{flex:none}
  .wl .gh svg,.lh img{flex:none}
  .day-h + .lg{border-top:0}
  #gamesList .list + .list{margin-top:12px}
  .lg:active{background:#1F1F23}
  .lg .teams{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .lg .tm{display:flex;align-items:center;gap:9px}
  .lg .tm img{width:22px;height:22px;object-fit:contain;flex:none}
  .lg .tm b{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg .tm .pts{font-size:17px;font-weight:800;min-width:30px;text-align:right}
  .lg .tm.behind b,.lg .tm.behind .pts{color:var(--muted);font-weight:600}
  .lg .st{width:72px;flex:none;text-align:right;font-size:12px;font-weight:800;color:var(--orange);border-left:1px solid var(--line);padding-left:10px;align-self:stretch;
          display:flex;align-items:center;justify-content:flex-end;gap:5px;letter-spacing:.03em}
  .lg .st i{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 1.4s infinite;flex:none}
  .nolive{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
  .lg .st{color:var(--muted);font-weight:700}
  .lg.live{background:linear-gradient(90deg,#FF6B1A1A,transparent 70%)}
  .lg.live .st{color:var(--orange);font-weight:800}
  .lg .st .fan{display:block;font-size:11px;color:var(--orange);font-weight:700;margin-top:3px;letter-spacing:0}
  .lg .st{flex-direction:column;align-items:flex-end;justify-content:center;gap:0}
  .lg .st .s{display:flex;align-items:center;gap:5px}
  .all-games{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;margin-top:10px;border-radius:16px;border:1px solid var(--line);
             background:var(--card);color:#fff;font-weight:700;font-size:15px;text-decoration:none}
  .all-games:active{background:#1F1F23}
  .all-games .chev{margin:0}
  .watch{display:block;margin-top:10px;border-style:dashed;color:inherit;text-decoration:none}
  .watch .rank{color:var(--muted);display:grid;place-items:center}
  .watch .score{font-size:18px;color:var(--muted)}
  .fb-btn{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0;border-style:solid}
  .sec-t{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin:26px 4px 10px}
  .base-input{width:104px;height:42px;border:1.5px solid var(--line);border-radius:16px;background:var(--card-2);color:#fff;
              font:800 18px Inter,system-ui,sans-serif;padding:0 12px;text-align:right;flex:none}
  .base-input:focus{outline:none;border-color:var(--orange)}
  .pl .ph{width:38px;height:38px;border-radius:50%;background:var(--card-2);flex:none;overflow:hidden;position:relative;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
  .pl .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
  .pl .who small{color:var(--muted)}
  .pl .tv{font-weight:700;color:#C9C9CF}
  #topList .row.pl{cursor:pointer}
  /* Games ↔ Players: the old view slides out to one side while the new one slides in from the other (Games is left of Players) */
  .vslide{transition:transform .16s cubic-bezier(.2,.8,.2,1),opacity .16s ease}
  .vgone{position:absolute;left:16px;right:16px;pointer-events:none}
  #topList .own{color:var(--orange);font-weight:700}      /* on someone's fantasy team */
  /* list headers: the same lighter glass as the 1st place on the Teams table */
  .lh{padding-right:6px}
  .lh .lt{flex:1 1 auto}
  .lh img{width:18px;height:18px;object-fit:contain}
  .lh + .row{border-top:0}
  .tune{flex:none;width:32px;height:32px;border-radius:10px;border:1px solid #FFFFFF22;background:#00000059;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
  .tune:active{background:#FFFFFF24}
  /* Top Performers settings sheet */
  #tfWrap .scrim{position:fixed;inset:0;background:#000000A6;opacity:0;pointer-events:none;transition:.2s;z-index:10}
  #tfWrap .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;background:var(--bg);border:1px solid var(--line);border-bottom:0;
         border-radius:24px 24px 0 0;display:flex;flex-direction:column;max-height:calc(100vh - var(--sat, env(safe-area-inset-top)) - 16px);max-height:calc(100dvh - var(--sat, env(safe-area-inset-top)) - 16px);
         transition:transform .25s ease,visibility .25s;visibility:hidden;z-index:11;overflow:hidden}
  #tfWrap.open .scrim{opacity:1;pointer-events:auto}
  #tfWrap.open .sheet{transform:translate(-50%,0);visibility:visible}
  #tfWrap .sheet.dragging{transition:none}
  #tfWrap .grab{flex:none;height:30px;display:grid;place-items:center;cursor:grab;touch-action:none}
  #tfWrap .grab::before{content:"";width:40px;height:4px;background:#3A3A40;border-radius:4px}
  #tfWrap .sh-head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 20px 14px;border-bottom:1px solid var(--line);touch-action:none}
  #tfWrap .sh-head b{font-size:20px;font-weight:800;display:block}
  #tfWrap .sh-head small{color:var(--muted);font-size:12.5px}
  #tfWrap .sh-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px calc(22px + var(--sab, env(safe-area-inset-bottom)))}
  .tf-done{flex:none;height:36px;padding:0 14px;border-radius:13px;border:0;background:#FFFFFF24;color:#fff;font:700 14px Inter,system-ui,sans-serif;cursor:pointer}
  .tf-l{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:#FFFFFFB3;text-transform:uppercase;margin:18px 4px 10px}
  .tf-rds{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
  .tf-clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .tf-rds button,.tf-clubs button{height:40px;border-radius:13px;border:1px solid #FFFFFF22;background:var(--card);color:#FFFFFFCC;font:700 14px Inter,system-ui,sans-serif;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;min-width:0;-webkit-tap-highlight-color:transparent}
  .tf-clubs button{justify-content:flex-start}
  .tf-clubs .all{grid-column:1/-1;justify-content:center}
  .tf-clubs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tf-clubs img{width:20px;height:20px;object-fit:contain;flex:none}
  .tf-rds button.on,.tf-clubs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
  .tf-rds button i{width:6px;height:6px;border-radius:50%;background:var(--orange);flex:none}
  .tf-rds button.on i{background:#fff}
  #tfWrap .tg{display:flex;align-items:center;gap:14px;width:100%;padding:12px 4px;border:0;background:none;color:#fff;text-align:left;cursor:pointer;border-radius:16px}
  #tfWrap .tg .txt{flex:1;min-width:0}
  #tfWrap .tg .txt b{display:block;font-size:16px;font-weight:800}
  #tfWrap .tg .txt small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  #tfWrap .sw{width:50px;height:30px;border-radius:999px;background:#3A3A40;position:relative;flex:none;transition:background .2s}
  #tfWrap .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
  #tfWrap .tg.on .sw{background:var(--orange)} #tfWrap .tg.on .sw::after{left:23px}
  #topList .row.pl:active{background:#1F1F23}
  /* Games: round arrows in the header */
  .rnav{display:flex;align-items:center;gap:8px;flex:none}
  .rnav button{-webkit-appearance:none;appearance:none;box-sizing:border-box;height:44px;min-height:44px;max-height:44px;margin:0;line-height:1;display:inline-flex;align-items:center;justify-content:center;border-radius:16px;border:1px solid #FFFFFF22;background:#00000080;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;cursor:pointer;
    font:700 14px Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .rnav .rn{width:44px;font-size:24px;padding:0 0 3px}
  .rnav .rn:disabled{opacity:.35;cursor:default}
  .rnav .rn-now{width:44px;padding:0}                 /* ↺ back to the current round: same glass as the ‹ N › control */
  .rnav button[hidden]{display:none}
  /* ‹ 10 › as one control */
  /* Games: ‹ Round N › above the list (tap "Round N" to jump back to the current round); same glass and height as the tab groups */
  .rgrp{height:44px;box-sizing:border-box;display:flex;gap:4px;padding:3px;border-radius:16px;border:1px solid #FFFFFF22;background:#00000080;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:center;margin-bottom:12px}
  .rgrp[hidden]{display:none}
  .top .rgrp,.top .seg{flex:none;margin:0 0 0 12px}
  .top .rgrp .rn{width:34px}
  .top .rgrp .rnum{flex:none;min-width:58px;padding:0 4px;font-size:14px}
  .top .seg.ic button{flex:none;width:44px;display:grid;place-items:center;padding:0}
  .top .seg[hidden]{display:none}
  .ctrl:empty{display:none}
  .rgrp button{-webkit-appearance:none;appearance:none;border:0;background:transparent;color:#fff;cursor:pointer;height:36px;border-radius:13px;padding:0}
  .rgrp .rn{width:44px;font-size:24px;line-height:1;padding-bottom:3px}
  .rgrp .rn:disabled{opacity:.3;cursor:default}
  .rgrp .rnum{flex:1;font:700 15px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
  .rgrp .rnum.away{color:#FFFFFFCC}
  /* Players: Watchlist / Top Performers tabs (same switch as Round / Total on Teams) */
  .seg{height:44px;box-sizing:border-box;display:flex;gap:4px;padding:3px;border-radius:16px;border:1px solid #FFFFFF22;background:#00000080;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:12px}
  .seg button{flex:1;height:36px;border:0;border-radius:13px;background:transparent;color:#FFFFFF99;font:700 14px Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s,color .15s}
  .seg button.on{background:#FFFFFF24;color:#fff}
  /* Watchlist rows look like a team's player list on Teams; "Empty slot" adds a player */
  .wl .p{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;position:relative;user-select:none;-webkit-user-select:none}
  .wl .gh + .p{border-top:0}
  .wl .p:active{background:#1F1F23}
  .wl .ph{width:46px;height:46px;border-radius:50%;background:var(--card-2);flex:none;overflow:hidden;position:relative;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
  .wl .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
  .wl .who b{font-size:15px}
  .wl .who small{margin-top:3px;display:flex;align-items:center;gap:6px}
  .wl .tv{font-weight:700;color:#C9C9CF}
  .wl .val{min-width:56px;text-align:right;font-size:20px;font-weight:800;flex:none}
  .wl .p.up .val,.wl .p.soon .val,.wl .p.none .val{color:var(--dim);font-weight:700}
  .wl .p.live{background:linear-gradient(90deg,#FF6B1A1F,transparent 75%)}
  .wl .p.live::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
  .wl .p.live .val{color:var(--orange)}
  .wl .p.empty .ph{background:transparent;border:1.5px dashed #46464D;color:var(--orange);font-size:22px;font-weight:500}
  .wl .p.empty .who b{color:var(--dim);font-weight:600}

<script>
/* ───────── league (hardcoded) ───────── */
const DEFAULT_COACHES = [
  {name:"Justelis", team:"SPEEDsters"},
  {name:"Darius",   team:"SPERMOS VAIKAI"},
  {name:"Deivis",   team:"Kundžiai"},
  {name:"Novikas",  team:"Vilkmergė"},
  {name:"Titas",    team:"Geri Sprendimai 0.7"},
  {name:"Saimonas", team:"KĖDAINIETIS"},
];
// roster storage stays keyed by coach name; team names can be renamed (shared with everyone via assets/sync.js)
const live = name => (Shared.enabled && Shared.ready) ? (Shared.coaches[name] || {}) : null;
const teamOf = c => { const d = live(c.name); return (d ? d.team : store.get("elf.teams", {})[c.name]) || c.team; };
// custom PIR (set by hand in edit mode) — the total list shows custom PIR + this round's PIR
const baseOf = c => { const d = live(c.name); return +(d ? d.base : store.get("elf.base", {})[c.name]) || 0; };
const COACHES = DEFAULT_COACHES;
let editing = false;

/* ───────── config (same as coach page) ───────── */
const today = new Date();
const SEASON = "E" + (today.getMonth() >= 6 ? today.getFullYear() : today.getFullYear() - 1);
// On the website, API calls go through the Worker's proxy (/el-api, /el-live). Local file → direct.
const DIRECT = location.protocol === "file:";
const COACH_PAGE = DIRECT ? "2-coach.html" : "/2-coach";   // same-origin, no redirect hop (keeps the home-screen app full-screen)
const V2 = `${DIRECT ? "https://api-live.euroleague.net" : "/el-api"}/v2/competitions/E/seasons/${SEASON}`;
const LIVE_API = DIRECT ? "https://live.euroleague.net/api" : "/el-live";
const LIVE_POLL = window.ELF_DEMO ? 5_000 : 30_000, IDLE_POLL = 5 * 60_000;
// group share of a player's PIR (older saved rosters used active/bench/inactive)
const MULT = {full:1, half:0.5, zero:0, active:1, bench:0.5, inactive:0};

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const $ = s => document.querySelector(s);
const r1 = v => Math.round(v * 100) / 100;          // values are kept to 2 decimals; only display rounds further
const fmtShort = v => r1(v).toFixed(1);               // cards, lists, totals: 14.3
const fmtFull  = v => r1(v).toFixed(2);               // detail views: 14.30
// team-result adjustment: ±10% of the absolute PIR, so negatives move the right way (−5 → −4.5 on a win, −5.5 on a loss)
const adjustPir = (raw, win) => r1(raw + (win ? 1 : -1) * Math.abs(raw) * 0.1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rosterOf = name => live(name)?.roster || store.get(`elf.roster.${name}`, []);
// share of a player's PIR — same rules as the coach page:
// group (100/50/0; Bench Boost lifts 50% → 100%) × captain (2×, Triple Captain 3×)
const chipsOf = name => (round != null && (live(name)?.chips || store.get(`elf.chips.${name}`, {}))[round]) || {};
function shareOf(p, wc){
  const slot = p.slot || (p.active === false ? "zero" : "full");
  const group = (slot === "half" || slot === "bench") ? (wc.bb ? 1 : 0.5) : (MULT[slot] ?? 0);
  const full = slot === "full" || slot === "active";
  return group * (p.captain && full ? (wc.tc ? 3 : 2) : 1);
}

let games = [], round = null, box = {}, timer = null;

async function getJSON(url){
  let r = await fetch(url, {cache:"no-store"}).catch(() => null);
  // Euroleague sometimes rate-limits our server (error 1015 / 429): then the phone asks Euroleague's live server itself
  if ((!r || !r.ok) && url.startsWith("/el-live/")) r = await fetch("https://live.euroleague.net/api/" + url.slice(9), {cache:"no-store"}).catch(() => r);
  if (!r || !r.ok) throw new Error(r ? r.status : "network");
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function cached(key, ttl, loader){
  const c = store.get(key);
  if (c && Date.now() - c.t < ttl) return c.v;
  try{ const v = await loader(); store.set(key, {t:Date.now(), v}); return v; }
  catch(e){ if (c) return c.v; throw e; }
}
const loadGames = () => cached(`elf.lgames.${SEASON}`, 10 * 60e3, async () => {
  const d = (await getJSON(`${V2}/games`)).data;
  const side = s => ({c:s.club.code, tv:s.club.tvCode || s.club.code, n:s.club.editorialName || s.club.name || s.club.code, cr:s.club.images?.crest || ""});
  return d.map(x => ({c:x.gameCode, r:x.round, u:x.utcDate, p:x.played, h:side(x.local), a:side(x.road)}));
});
async function loadBox(g){
  const key = `elf.box2.${SEASON}.${g.c}`;
  const c = store.get(key);
  if (c && c.final && ElData.keep(c)) return c;        // finished: re-checked hourly (Euroleague corrects box scores), kept for good after ~2 days
  let d;
  try{ d = await getJSON(`${LIVE_API}/Boxscore?gamecode=${g.c}&seasoncode=${SEASON}`); }
  catch(e){ if (c && c.final) return c; throw e; }
  if (!d || !d.Stats || d.Stats.length < 2) return {pending:true};
  const teams = d.Stats.map(s => {
    const pl = {};
    s.PlayersStats.forEach(p => pl[p.Player_ID.replace(/^P/, "").trim()] = {pir:p.Valuation, min:p.Minutes});
    return {pts: +(s.totr?.Points || 0), pl};
  });
  const tot = teams[0].pts + teams[1].pts;
  const b = {live: !!d.Live, final: !d.Live && tot > 0, pending: !d.Live && tot === 0, teams};
  if (b.live){ try{ const h = await getJSON(`${LIVE_API}/Header?gamecode=${g.c}&seasoncode=${SEASON}`); b.q = h?.Quarter; b.t = h?.RemainingPartialTime; }catch{} }
  if (b.final){ const v = ElData.stamp(c, b); store.set(key, v); return v; }
  return b;
}

/* PIR for one player this round, before the group share (null = not played yet) */
function playerPir(p, r = round){
  const g = games.find(g => g.r === r && (g.h.c === p.club || g.a.c === p.club));
  if (!g) return null;
  const b = box[g.c];
  if (!b || b.pending) return null;
  const home = g.h.c === p.club;
  const ti = b.teams[0].pl[p.code] ? 0 : b.teams[1].pl[p.code] ? 1 : (home ? 0 : 1);
  const me = b.teams[ti], them = b.teams[1 - ti], st = me.pl[p.code];
  const played = !!st && !/dnp/i.test(st.min || "");
  const pir = played ? st.pir : 0;
  // live: raw PIR · final: ±10% for the team's win/loss (same rule as the coach page)
  return {f: b.live ? pir : adjustPir(pir, me.pts > them.pts), live: b.live, played};
}
function coachTotal(c){
  let t = 0, live = false;
  const wc = chipsOf(c.name);
  rosterOf(c.name).forEach(p => {
    const share = shareOf(p, wc); if (!share) return;
    const s = playerPir(p); if (s){ t += r1(s.f * share); live ||= s.live; }
  });
  return {total: r1(t), live};
}

function render(){
  $("#roundTxt").textContent = "";                    // no "Round X" under Games / Players (Games shows it between the arrows)
  renderTop();
  renderGames();
  GameSheet.update();
  renderRnav();
  if (PlayerSheet.isOpen()){ const p = PlayerSheet.current(), r = [...watchRows, ...topRows].find(x => x.p.code === p?.code);
    if (p) PlayerSheet.update({state: sheetState(p), meta: r ? sheetMeta(p, r.teams) : undefined}); }
}

/* live games of the round: score + clock; tap → the game's court view in the Game Center */
const clockOf = b => { const q = String(b.q || "").replace(/\D/g, ""); return (q ? (+q > 4 ? "OT" : "Q" + q) : "LIVE") + (b.t && b.t !== "00:00" ? " " + b.t.replace(/^0/, "") : ""); };
/* Games: browse other rounds with ‹ › in the header; "Current" jumps back */
let gRound = null;                                   // null = follow the current round
const shownRound = () => gRound ?? round;
const roundSpan = () => games.length ? [Math.min(...games.map(g => g.r)), Math.max(...games.map(g => g.r))] : [1, 1];
function renderRnav(){
  const nav = $("#rnav"), was = nav.hidden; nav.hidden = view !== "games" || !round;
  if (was !== nav.hidden) sizeHeader();
  if (nav.hidden) return;
  const [lo, hi] = roundSpan(), r = shownRound();
  $("#rPrev").disabled = r <= lo; $("#rNext").disabled = r >= hi;
  $("#rNum").textContent = `RD ${r}`; $("#rNum").setAttribute("aria-label", `Round ${r}${r !== round ? " — back to the current round" : ""}`); $("#rNum").classList.toggle("away", r !== round);
}
async function goRound(r){
  const [lo, hi] = roundSpan(); r = Math.max(lo, Math.min(hi, r));
  gRound = r === round ? null : r;
  $("#scroller").scrollTo({top: 0}); render();
  if (gRound == null) return;
  const need = games.filter(g => g.r === r && Date.parse(g.u) <= Date.now() && !(box[g.c] && (box[g.c].final || box[g.c].live)));   // scores for that round's games
  const res = await Promise.all(need.map(g => loadBox(g).then(b => [g.c, b]).catch(() => [g.c, null])));
  res.forEach(([c, b]) => { if (b) box[c] = b; });
  if (shownRound() === r) render();
}
$("#rPrev").addEventListener("click", () => goRound(shownRound() - 1));
$("#rNext").addEventListener("click", () => goRound(shownRound() + 1));
$("#rNum").addEventListener("click", () => goRound(round));   // "Round N": back to the current round
function renderGames(){
  if (!games.length) return;
  const now = Date.now();
  const stOf = g => { const b = box[g.c];
    if (b?.live) return {k: 0, live: true, b};
    if (b?.final) return {k: 3, b};
    if (Date.parse(g.u) <= now) return {k: 1};
    return {k: 2}; };
  const rg = games.filter(g => g.r === shownRound()).map(g => ({g, s: stOf(g)}))
                  .sort((x, y) => x.s.k - y.s.k || Date.parse(x.g.u) - Date.parse(y.g.u));   // live, starting, upcoming, finished
  if (!rg.length){ $("#gamesList").innerHTML = `<div class="list"><div class="nolive">No games this round.</div></div>`; $("#gamesList")._html = null; return; }
  const fans = g => new Set(COACHES.flatMap(c => rosterOf(c.name)).filter(p => p.club === g.h.c || p.club === g.a.c).map(p => p.code)).size;
  const row = ({g, s}) => {
    const has = !!s.b, hp = has ? s.b.teams[0].pts : "", ap = has ? s.b.teams[1].pts : "";
    const tm = (t, pts, behind) => `<div class="tm${behind ? " behind" : ""}">${t.cr ? `<img src="${esc(t.cr)}" alt="" loading="lazy">` : ""}<b>${esc(t.n || t.tv)}</b>${has ? `<span class="pts">${pts}</span>` : ""}</div>`;
    const st = s.live ? `<span class="s"><i></i>${esc(clockOf(s.b))}</span>` : s.k === 3 ? "FINAL" : s.k === 1 ? "STARTING" : esc(when(g.u));
    const f = fans(g);
    return `<div class="lg${s.live ? " live" : ""}" data-game="${g.c}" role="button" tabindex="0">
      <div class="teams">${tm(g.h, hp, has && hp < ap)}${tm(g.a, ap, has && ap < hp)}</div>
      <div class="st">${st}${f ? `<span class="fan">${f} fantasy</span>` : ""}</div></div>`;
  };
  // games on several days → a list per day (in date order) under a headline like "27 October 2026"
  const dayKey = u => { const d = new Date(u); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const dayDone = k => rg.filter(x => dayKey(x.g.u) === k).every(x => x.s.k === 3);     // every game that day final
  const days = [...new Set(rg.map(x => dayKey(x.g.u)))].sort((a, b) => dayDone(a) - dayDone(b) || a.localeCompare(b));   // finished days go to the bottom
  const html = days.length < 2 ? `<div class="list">${rg.map(row).join("")}</div>`
    : days.map(k => { const list = rg.filter(x => dayKey(x.g.u) === k);
        return `<div class="list"><div class="day-h"><span class="lt">${esc(new Date(list[0].g.u).toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"}))}</span><span class="lx">${list.length} game${list.length === 1 ? "" : "s"}</span></div>${list.map(row).join("")}</div>`; }).join("");
  if ($("#gamesList")._html !== html) $("#gamesList").innerHTML = $("#gamesList")._html = html;
}
const when = u => new Date(u).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"});

/* game sheet (assets/game-sheet.js): tap a game in the Games tab, or the score box in a player sheet */
const loadPeople = () => cached(`elf.people.${SEASON}`, 12 * 3600e3, async () => {     // same list + cache as the coach page
  const nice = s => String(s || "").split(",").map(x => x.trim()).reverse().join(" ").toLowerCase().replace(/(^|[\s'-])\p{L}/gu, c => c.toUpperCase());
  const d = (await getJSON(`${V2}/people?personType=J`)).data;
  const m = new Map();
  d.filter(x => x.active).forEach(x => m.set(x.person.code, {code: x.person.code, name: nice(x.person.name), club: x.club.code, tv: x.club.tvCode || x.club.code,
    clubName: x.club.editorialName || x.club.name, crest: x.club.images?.crest || "", img: x.images?.headshot || "", pos: (x.positionName || "–").charAt(0)}));
  return [...m.values()];
});
function owners(){                                    // player code → fantasy teams that have him
  const m = new Map();
  COACHES.forEach(c => rosterOf(c.name).forEach(p => { const l = m.get(p.code) || []; l.push(teamOf(c)); m.set(p.code, l); }));
  return m;
}
GameSheet.init({games: () => games, owners, people: loadPeople});

let tRound = null;                                    // picked round (null = the default)
const roundLive = () => games.some(g => g.r === round && Date.parse(g.u) <= Date.now());
const topRound = () => tRound ?? (roundLive() || round <= 1 ? round : round - 1);
const topLoading = new Set();
async function loadTopRound(r){                       // scores of an earlier round's games (kept on the phone once final)
  if (r === round || topLoading.has(r)) return;
  const need = games.filter(g => g.r === r && Date.parse(g.u) <= Date.now() && !(box[g.c] && box[g.c].final));
  if (!need.length) return;
  topLoading.add(r);
  const res = await Promise.all(need.map(g => loadBox(g).then(b => [g.c, b]).catch(() => [g.c, null])));

}
function renderTop(){

  const own = owners(), pmap = new Map(people.map(x => [x.code, x])), rmap = new Map(COACHES.flatMap(c => rosterOf(c.name)).map(x => [x.code, x]));
  if (!people.length) ensurePeople();
  for (const g of games.filter(g => g.r === tr)){
    const b = box[g.c]; if (!b || b.pending || !b.teams || b.teams.length < 2) continue;
    b.teams.forEach((t, ti) => {
      const side = ti === 0 ? g.h : g.a, them = b.teams[1 - ti];
      for (const [code, st] of Object.entries(t.pl || {})){
        if (!st || /dnp/i.test(st.min || "")) continue;
        const who = pmap.get(code) || rmap.get(code); if (!who) continue;
        const p = {...who, code, club: side.c, tv: side.tv || side.c, clubName: side.n || who.clubName};
        seen.set(code, {p, s: {f: b.live ? st.pir : adjustPir(st.pir, t.pts > them.pts), live: b.live, played: true}, teams: own.get(code) || []});
      }
    });
  }
  // club: All teams (default) or one Euroleague club → that club's top 10; players nobody owns can be left out
  const clubs = topClubs(), pick = clubs.has(topPick) ? topPick : "", free = topFree();
  renderWatch();
  if ($("#tfWrap").classList.contains("open")) renderTopSheet();
  const top = [...seen.values()].filter(x => (!pick || x.p.club === pick) && (free || x.teams.length)).sort((a, b) => b.s.f - a.s.f).slice(0, 10);
  // the list's header: what it shows on the left, the settings on the right
  const club = pick ? clubs.get(pick) : null;
  const head = `<div class="lh">${club?.cr ? `<img src="${esc(club.cr)}" alt="">` : ""}<span class="lt">Round ${tr} · ${esc(club ? club.n : "All Teams")}`
    + ` <span class="lx">· ${free ? "All Players" : "Fantasy Players"}${tr === round && roundLive() ? " · Live" : ""}</span></span>`
    + `<button class="tune" data-tune aria-label="Filter Top Performers"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4.25 5.61C6.27 8.2 10 13 10 13v6c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-6s3.72-4.8 5.74-7.39A1 1 0 0 0 18.95 4H5.04c-.83 0-1.3.95-.79 1.61z"/></svg></button></div>`;
  if (!top.length){
    topRows = [];
    $("#topList").innerHTML = head + `<div class="nolive">${topLoading.has(tr) || (!people.length && peopleLoad) ? "Loading…"
      : pick ? `No ${esc(club.n)}${free ? "" : " fantasy"} players have played ${tr === round ? "yet this round" : `in round ${tr}`}.`
      : !free && seen.size ? `No fantasy players have played ${tr === round ? "yet this round" : `in round ${tr}`}.`
      : tr === round ? "No live games yet — the round's top players show up once games start." : `No scores for round ${tr}.`}</div>`;
    return;
  }
  topRows = top;
  $("#topList").innerHTML = head + top.map(({p, s, teams}, i) => `
    <div class="row pl" data-code="${esc(p.code)}" role="button" tabindex="0">
      <div class="rank"${i === 0 ? ' style="color:var(--orange)"' : ""}>${i + 1}</div>
      <div class="ph">${esc((p.name || "").split(" ").map(w => w[0]).slice(0, 2).join(""))}${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
      <div class="who"><b>${esc(p.name)}</b><small><span class="tv">${esc(p.tv || "")}</span>${teams.length ? ` · <span class="own">${esc(teams.join(", "))}</span>` : ""}</small></div>
      <div class="score">${s.live ? '<i class="live-dot"></i>' : ""}${fmtShort(s.f)}</div>
    </div>`).join("");
}

function relevantGames(){
  const clubs = new Set([...COACHES.flatMap(c => rosterOf(c.name).map(p => p.club)), ...store.get("elf.watch", []).map(p => p.club)]);
  return games.filter(g => g.r === round && (clubs.has(g.h.c) || clubs.has(g.a.c)));
}
async function refresh(){
  if (!games.length) return;
  // every started game of the round (not just ours): the Start button waits for all of them
  const need = games.filter(g => g.r === round && new Date(g.u) <= new Date() && !(box[g.c] && box[g.c].final && ElData.keep(box[g.c])));
  const res = await Promise.all(need.map(g => loadBox(g).then(b => [g.c, b]).catch(() => [g.c, box[g.c]])));
  res.forEach(([c, b]) => { if (b) box[c] = b; });
  render();
  clearTimeout(timer);
  if (elfHidden()) return;
  const now = Date.now(), rel = relevantGames();
  const inPlay = games.some(g => g.r === round && new Date(g.u) <= now && !(box[g.c] && box[g.c].final));
  const next = rel.map(g => +new Date(g.u)).filter(t => t > now).sort((a, b) => a - b)[0];
  timer = setTimeout(refresh, inPlay ? LIVE_POLL : next ? Math.min(IDLE_POLL, Math.max(10_000, next - now + 5_000)) : IDLE_POLL);
}

    sw = null;
    if (e.touches.length !== 1 || !e.target.closest("#scroller, #ctrl") || e.target.closest("input, select, textarea")) return;
    const t = e.touches[0]; sw = {x: t.clientX, y: t.clientY, t: e.timeStamp, h: null};
  }, {passive: true});
  document.addEventListener("touchmove", e => {
    if (!sw || sw.h != null) return;
    const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) sw.h = Math.abs(dx) > Math.abs(dy) * 1.5;   // decided by the first clear movement
  }, {passive: true});
  document.addEventListener("touchend", e => {
    const s = sw; sw = null;
    if (!s || !s.h) return;
    const t = e.changedTouches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (Math.abs(dx) < 60 && !(Math.abs(dx) > 30 && Math.abs(dx) / Math.max(1, e.timeStamp - s.t) > 0.4)) return;   // far enough, or a quick flick
    if (Math.abs(dy) > Math.abs(dx)) return;
    const dir = dx < 0 ? 1 : -1;                         // swipe left → the next one (right side), swipe right → the one before
    if (view === "players"){
      const order = ["watch", "top"], i = order.indexOf(pTab) + dir;
      if (i < 0 || i >= order.length) return;
      setPTab(order[i]); $("#scroller").scrollTo({top: 0}); nudge($("#vPlayers"), dir);
    } else if (view === "games" && round){
      const [lo, hi] = roundSpan(), r = shownRound() + dir;
      if (r < lo || r > hi) return;
      goRound(r); nudge($("#vGames"), dir);
    }
  }, {passive: true});
  document.addEventListener("touchcancel", () => { sw = null; }, {passive: true});
}

Nav.init({active: view, onTap: k => {
  if (k === "teams") return false;                    // Teams: the team pages
  if (k === "players") playersDefault();
  if (k !== view){ view = k; showView(); $("#scroller").scrollTo({top: 0}); }
  else $("#scroller").scrollTo({top: 0, behavior: "smooth"});       // same tab again: back to the top
  return true;
}});
showView();

/* edits from anyone arrive here */
Shared.on(first => {
  if (first && Shared.enabled){        // upload names renamed on this phone before sharing existed
    const names = store.get("elf.teams", {});
    COACHES.forEach(c => { if (names[c.name] && !Shared.coaches[c.name]?.team) Shared.push(c.name, {team: names[c.name]}); });
  }
  if (Shared.league?.round && games.length && round !== Shared.league.round) round = Shared.league.round;   // next round started
  render(); refresh();
});

async function boot(){
  render();
  Shared.start();
  try{
    games = await loadGames();
    const started = games.filter(g => new Date(g.u) <= new Date());
    round = Shared.league?.round       // the league's round (moves on with Start Round X)
      ?? (started.length ? Math.max(...started.map(g => g.r)) : Math.min(...games.map(g => g.r)));
  }catch{ render(); return; }
  refresh();
}
boot();
</script>
