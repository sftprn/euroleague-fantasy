<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<!-- home-screen app: stay full-screen when moving between pages (iOS + Android) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EL Fantasy">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<title>League · EL Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --card:#18181B; --card-2:#232327; --line:#2B2B30; --text:#FFFFFF; --muted:#9A9AA3; --dim:#5E5E66;
    --orange:#FF6B1A; --win:#3DDC84;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;font-variant-numeric:tabular-nums}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px 40px}

  /* header */
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:40px;height:40px;flex:none;display:block}
  .titles{flex:1;min-width:0}
  .icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;flex:none;font-family:inherit}
  .icon-btn.on{background:var(--orange);border-color:var(--orange);font-size:20px;font-weight:800}
  header h1{font-weight:800;font-size:19px;letter-spacing:.02em;line-height:1}
  header small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px;letter-spacing:.04em}

  /* standings */
  .list{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .row:first-child{border-top:0}
  .row:active{background:#1F1F23}
  .rank{width:24px;font-weight:800;font-size:18px;color:var(--dim);text-align:center;flex:none}

  /* 1st place: hero row with the background art */
  .row.lead{position:relative;align-items:center;min-height:72px;padding:14px 16px;
            background:url("assets/bg.jpg") center 35%/cover}
  .row.lead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0A0A0B1A 0%,#0A0A0B80 55%,#0A0A0BE6 100%)}
  .row.lead > *{position:relative;z-index:1}
  .row.lead .rank{color:var(--orange)}
  .row.lead .lbl{display:block;font-size:10.5px;letter-spacing:.14em;color:#FFFFFFB3;font-weight:700;margin-bottom:4px}
  .row.lead .chev{color:#FFFFFF99}
  .row.lead .live-dot{vertical-align:middle;margin-right:4px}
  .row.lead.editing{min-height:0;align-items:center}
  .row.editing .who b{font-size:16px}
  .who{flex:1;min-width:0}
  .who b{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .score{font-size:21px;font-weight:800;text-align:right;flex:none;display:flex;align-items:center;gap:8px}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);animation:pulse 1.4s infinite}
  .chev{color:var(--dim);font-size:20px;margin-left:2px}
  .team-input{width:100%;height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-2);color:#fff;
              font:700 16px Inter,system-ui,sans-serif;padding:0 12px}
  .team-input:focus{outline:none;border-color:var(--orange)}
  /* Start Round X — appears when every game of the round is over; 2 phones start the next round */
  .start{margin:-2px 0 14px}
  .start-btn{width:100%;height:48px;border:0;border-radius:14px;background:var(--orange);color:#fff;font:800 16px Inter,system-ui,sans-serif;
             letter-spacing:.3px;cursor:pointer;box-shadow:0 6px 20px #FF6B1A33;display:flex;align-items:center;justify-content:center;gap:10px;
             transition:transform .1s,background .15s,box-shadow .15s}
  .start-btn:active{transform:scale(.98)}
  .start-btn.voted{background:var(--card);border:2px solid var(--orange);color:var(--orange);box-shadow:none}
  .start-btn:disabled{opacity:.6}
  .start-note{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-top:8px}
  .seg{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
  .seg button{flex:1;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 14px Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s,color .15s}
  .seg button.on{background:var(--orange);color:#fff}
  /* Teams table: rank · team · ROUND │ TOTAL */
  .tbl .th{display:flex;align-items:center;gap:14px;padding:10px 16px 8px;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--dim);border-bottom:1px solid var(--line)}
  .tbl .th .who{font-size:10.5px}
  .tbl .th button{all:unset;cursor:pointer;color:var(--dim);white-space:nowrap} .tbl .th button.on{color:#fff}
  .tbl .th button.on::after{content:" ▾"}
  .tbl .th + .row{border-top:0}
  .tbl .row,.tbl .th{gap:10px}
  .tbl .who b{font-size:15.5px}
  .c-rd{width:52px;text-align:right;flex:none;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:flex-end;position:relative}
  .c-rd .live-dot{position:absolute;left:-6px;top:50%;margin-top:-3.5px}
  .c-tot{width:70px;text-align:right;flex:none;font-size:15px;font-weight:700;color:#C9C9CF;align-self:stretch;display:flex;align-items:center;justify-content:flex-end;
         border-left:1px solid var(--line);margin:-15px 0;padding:15px 0}
  .th .c-rd,.th .c-tot{font-size:10.5px;font-weight:800;color:var(--dim);margin:-10px 0 -8px;padding:10px 0 8px}
  .row.lead .c-tot{border-left-color:#FFFFFF33;color:#FFFFFFD9;margin:-14px 0;padding:14px 0}
  .tbl .row.editing .base-input{width:92px}
  /* live games */
  .lg{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
  .lg:first-child{border-top:0}
  .lg:active{background:#1F1F23}
  .lg .teams{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .lg .tm{display:flex;align-items:center;gap:9px}
  .lg .tm img{width:22px;height:22px;object-fit:contain;flex:none}
  .lg .tm b{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg .tm .pts{font-size:17px;font-weight:800;min-width:30px;text-align:right}
  .lg .tm.behind b,.lg .tm.behind .pts{color:var(--muted);font-weight:600}
  .lg .st{width:72px;flex:none;text-align:right;font-size:12px;font-weight:800;color:var(--orange);border-left:1px solid var(--line);padding-left:10px;align-self:stretch;
          display:flex;align-items:center;justify-content:flex-end;gap:5px;letter-spacing:.03em}
  .lg .st i{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 1.4s infinite;flex:none}
  .nolive{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
  .lg .st{color:var(--muted);font-weight:700}
  .lg.live{background:linear-gradient(90deg,#FF6B1A1A,transparent 70%)}
  .lg.live .st{color:var(--orange);font-weight:800}
  .lg .st .fan{display:block;font-size:11px;color:var(--orange);font-weight:700;margin-top:3px;letter-spacing:0}
  .lg .st{flex-direction:column;align-items:flex-end;justify-content:center;gap:0}
  .lg .st .s{display:flex;align-items:center;gap:5px}
  .all-games{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;margin-top:10px;border-radius:14px;border:1px solid var(--line);
             background:var(--card);color:#fff;font-weight:700;font-size:15px;text-decoration:none}
  .all-games:active{background:#1F1F23}
  .all-games .chev{margin:0}
  .watch{display:block;margin-top:10px;border-style:dashed;color:inherit;text-decoration:none}
  .watch .rank{color:var(--muted);display:grid;place-items:center}
  .watch .score{font-size:18px;color:var(--muted)}
  .sec-t{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin:26px 4px 10px}
  .base-input{width:104px;height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-2);color:#fff;
              font:800 18px Inter,system-ui,sans-serif;padding:0 12px;text-align:right;flex:none}
  .base-input:focus{outline:none;border-color:var(--orange)}
  .pl .ph{width:38px;height:38px;border-radius:50%;background:var(--card-2);flex:none;overflow:hidden;position:relative;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
  .pl .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
  .pl .who small{color:var(--muted)}
  .pl .tv{font-weight:700;color:#C9C9CF}
  .row .plus-rd{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
  .row.editing{cursor:default}
  /* game sheet (tap a game in the Games tab): score, Box score / Court */
  .scrim{position:fixed;inset:0;background:#000000A6;opacity:0;pointer-events:none;transition:.2s;z-index:10}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;background:var(--bg);border:1px solid var(--line);border-bottom:0;
         border-radius:24px 24px 0 0;display:flex;flex-direction:column;max-height:calc(100vh - env(safe-area-inset-top) - 16px);max-height:calc(100dvh - env(safe-area-inset-top) - 16px);
         height:calc(100dvh - env(safe-area-inset-top) - 16px);transition:transform .25s ease,visibility .25s;visibility:hidden;z-index:11;overflow:hidden}
  .open .scrim{opacity:1;pointer-events:auto}
  .open .sheet{transform:translate(-50%,0);visibility:visible}
  .sheet.dragging{transition:none}
  .grab{flex:none;height:28px;display:grid;place-items:center;cursor:grab;touch-action:none}
  .grab::before{content:"";width:40px;height:4px;background:#3A3A40;border-radius:4px}
  .sh-head{flex:none;padding:14px 16px 0;touch-action:none}
  .sh-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
  .sh-close{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:11px;border:0;background:var(--card-2);color:#fff;font-size:15px;cursor:pointer;z-index:2}
  .board{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;margin-bottom:12px}
  .board .side{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
  .board .side img{width:44px;height:44px;object-fit:contain}
  .board .side b{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .board .mid{text-align:center;flex:none}
  .board .mid .sc{font-size:34px;font-weight:800;letter-spacing:-.02em}
  .board .mid small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:.05em}
  .board .mid small.lv{color:var(--orange)}

  /* box score tables */
  .bx{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
  .bx h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;padding:12px 14px 4px}
  .bx h3 img{width:20px;height:20px;object-fit:contain}
  .bx h3 span{margin-left:auto;font-size:16px}
  .tmw{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .tmt{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
  .tmt th,.tmt td{padding:9px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  .tmt tr:last-child td{border-bottom:0}
  .tmt th{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;cursor:pointer;user-select:none}
  .tmt th.on{color:#fff} .tmt th.on::after{content:" ▾";font-size:9px} .tmt th.on.asc::after{content:" ▴"}
  .tmt th:last-child,.tmt td:last-child{padding-right:14px}
  .tmt th:first-child,.tmt td:first-child{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;max-width:160px;padding-left:14px;
    overflow:hidden;text-overflow:ellipsis;box-shadow:6px 0 8px -6px #00000099}
  .tmt td:first-child .no{color:var(--dim);font-size:11px;margin-right:6px;display:inline-block;min-width:14px}
  .tmt td:first-child small{display:block;font-size:10.5px;color:var(--orange);font-weight:700;margin-top:1px;padding-left:20px;overflow:hidden;text-overflow:ellipsis}
  .tmt td.pir{font-weight:800}
  .tmt tr.fan td{background:#1E1712} .tmt tr.fan td:first-child{background:#1E1712}
  .tmt tr.dnp td{color:var(--dim)}
  .tmt .oc{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--win);margin-left:5px;vertical-align:middle}

  /* court view */
  .court{position:relative;margin-bottom:14px}
  .court h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:4px 2px 8px}
  .court h3 img{width:20px;height:20px;object-fit:contain}
  .court h3 small{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
  .floor{position:relative;width:100%;aspect-ratio:828/551;background:url("assets/court.svg") center/100% 100% no-repeat}
  .pc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:84px;text-align:center}
  .pc .ph{width:46px;height:46px;border-radius:50%;background:var(--card-2);overflow:hidden;position:relative;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);
          border:2px solid #FFFFFF33}
  .pc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
  .pc.fan .ph{border-color:var(--orange);box-shadow:0 0 0 3px #FF6B1A40}
  .pc b{font-size:11.5px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:0 1px 3px #000}
  .pc .v{font-size:11px;font-weight:800;background:#0A0A0BCC;border-radius:6px;padding:1px 6px;margin-top:2px}
  .pc .own{position:absolute;top:-6px;right:12px;background:var(--orange);color:#fff;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 5px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{font-size:11.5px;color:var(--dim);padding:6px 2px 0}
  .sh-body .empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
  .lg{cursor:pointer}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #FF6B1A99}70%{box-shadow:0 0 0 7px #FF6B1A00}100%{box-shadow:0 0 0 0 #FF6B1A00}}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="assets/euroleague.svg" alt="">
    <div class="titles"><h1>EUROLEAGUE FANTASY</h1><small id="roundTxt">2026–27 · ROUND –</small></div>
    <button class="icon-btn" id="editBtn" aria-label="Edit team names and custom PIR">✎</button>
  </header>

  <div class="start" id="startWrap" hidden>
    <button class="start-btn" id="startBtn"></button>
    <div class="start-note" id="startNote"></div>
  </div>

  <div class="seg" role="tablist" id="seg">
    <button role="tab" data-view="teams">Teams</button>
    <button role="tab" data-view="games">Games</button>
    <button role="tab" data-view="players">Players</button>
  </div>

  <!-- Teams: round PIR | season total, as a small table (tap a column title to sort by it) -->
  <div id="vTeams">
    <div class="list tbl" id="list"></div>
  <!-- private watch team: stored only on this phone, never counted; opens as the last page of the team pages -->
    <a class="list watch" id="watchRow" href="/2-coach?coach=watch">
    <div class="row">
      <div class="rank"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div class="who"><b>Watch team</b><small id="watchSub">Only on this phone · follow any players</small></div>
      <div class="score" id="watchVal"><span class="chev">›</span></div>
    </div>
  </a>
  </div>

  <!-- Games: this round's games (Game Center); tap one to open it -->
  <div id="vGames" hidden>
    <div class="list" id="gamesList"><div class="nolive">Loading…</div></div>
  </div>

  <!-- Players: top 10 of the round among everyone's rosters -->
  <div id="vPlayers" hidden>
    <div class="list" id="topList"></div>
  </div>


  <!-- demos for testing (shown in edit mode); they run in a pretend league, nothing reaches the real one -->
  <div id="demoLinks" hidden>
    <div class="sec-t">DEMOS</div>
    <div class="list">
      <a class="row" href="/1-league?demo=live&new"><div class="who"><b>Live games</b><small>Games tipping off, live PIR climbing</small></div><div class="score"><span class="chev">›</span></div></a>
      <a class="row" href="/1-league?demo=round&new"><div class="who"><b>Start new round</b><small>Round finished, try the Start Round button</small></div><div class="score"><span class="chev">›</span></div></a>
    </div>
  </div>
</div>

<!-- one game: opens over the page from the Games tab; close it to get back -->
<div id="gWrap">
  <div class="scrim" data-gclose></div>
  <div class="sheet" role="dialog" aria-label="Game">
    <button class="sh-close" data-gclose aria-label="Close">✕</button>
    <div class="grab" aria-hidden="true"></div>
    <div class="sh-head">
      <div class="board" id="board"></div>
      <div class="seg" id="gSeg"><button data-v="box">Box score</button><button data-v="court">Court</button></div>
    </div>
    <div class="sh-body" id="gBody"></div>
  </div>
</div>

<script src="assets/demo.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/data.js"></script>
<script>
/* ───────── league (hardcoded) ───────── */
const DEFAULT_COACHES = [
  {name:"Justelis", team:"SPEEDsters"},
  {name:"Darius",   team:"SPERMOS VAIKAI"},
  {name:"Deivis",   team:"Kundžiai"},
  {name:"Novikas",  team:"Vilkmergė"},
  {name:"Titas",    team:"Geri Sprendimai 0.7"},
  {name:"Saimonas", team:"KĖDAINIETIS"},
];
// roster storage stays keyed by coach name; team names can be renamed (shared with everyone via assets/sync.js)
const live = name => (Shared.enabled && Shared.ready) ? (Shared.coaches[name] || {}) : null;
const teamOf = c => { const d = live(c.name); return (d ? d.team : store.get("elf.teams", {})[c.name]) || c.team; };
// custom PIR (set by hand in edit mode) — the total list shows custom PIR + this round's PIR
const baseOf = c => { const d = live(c.name); return +(d ? d.base : store.get("elf.base", {})[c.name]) || 0; };
const COACHES = DEFAULT_COACHES;
let editing = false;

/* ───────── config (same as coach page) ───────── */
const today = new Date();
const SEASON = "E" + (today.getMonth() >= 6 ? today.getFullYear() : today.getFullYear() - 1);
// On the website, API calls go through the Worker's proxy (/el-api, /el-live). Local file → direct.
const DIRECT = location.protocol === "file:";
const COACH_PAGE = DIRECT ? "2-coach.html" : "/2-coach";   // same-origin, no redirect hop (keeps the home-screen app full-screen)
const V2 = `${DIRECT ? "https://api-live.euroleague.net" : "/el-api"}/v2/competitions/E/seasons/${SEASON}`;
const LIVE_API = DIRECT ? "https://live.euroleague.net/api" : "/el-live";
const LIVE_POLL = window.ELF_DEMO ? 5_000 : 30_000, IDLE_POLL = 5 * 60_000;
// group share of a player's PIR (older saved rosters used active/bench/inactive)
const MULT = {full:1, half:0.5, zero:0, active:1, bench:0.5, inactive:0};

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const $ = s => document.querySelector(s);
const r1 = v => Math.round(v * 100) / 100;          // values are kept to 2 decimals; only display rounds further
const fmtShort = v => r1(v).toFixed(1);               // cards, lists, totals: 14.3
const fmtFull  = v => r1(v).toFixed(2);               // detail views: 14.30
// team-result adjustment: ±10% of the absolute PIR, so negatives move the right way (−5 → −4.5 on a win, −5.5 on a loss)
const adjustPir = (raw, win) => r1(raw + (win ? 1 : -1) * Math.abs(raw) * 0.1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rosterOf = name => live(name)?.roster || store.get(`elf.roster.${name}`, []);
// share of a player's PIR — same rules as the coach page:
// group (100/50/0; Bench Boost lifts 50% → 100%) × captain (2×, Triple Captain 3×)
const chipsOf = name => (round != null && (live(name)?.chips || store.get(`elf.chips.${name}`, {}))[round]) || {};
function shareOf(p, wc){
  const slot = p.slot || (p.active === false ? "zero" : "full");
  const group = (slot === "half" || slot === "bench") ? (wc.bb ? 1 : 0.5) : (MULT[slot] ?? 0);
  const full = slot === "full" || slot === "active";
  return group * (p.captain && full ? (wc.tc ? 3 : 2) : 1);
}

let games = [], round = null, box = {}, timer = null;

async function getJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error(r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function cached(key, ttl, loader){
  const c = store.get(key);
  if (c && Date.now() - c.t < ttl) return c.v;
  try{ const v = await loader(); store.set(key, {t:Date.now(), v}); return v; }
  catch(e){ if (c) return c.v; throw e; }
}
const loadGames = () => cached(`elf.lgames.${SEASON}`, 10 * 60e3, async () => {
  const d = (await getJSON(`${V2}/games`)).data;
  const side = s => ({c:s.club.code, tv:s.club.tvCode || s.club.code, n:s.club.editorialName || s.club.name || s.club.code, cr:s.club.images?.crest || ""});
  return d.map(x => ({c:x.gameCode, r:x.round, u:x.utcDate, p:x.played, h:side(x.local), a:side(x.road)}));
});
async function loadBox(g){
  const key = `elf.box.${SEASON}.${g.c}`;
  const c = store.get(key);
  if (c && c.final) return c;
  const d = await getJSON(`${LIVE_API}/Boxscore?gamecode=${g.c}&seasoncode=${SEASON}`);
  if (!d || !d.Stats || d.Stats.length < 2) return {pending:true};
  const teams = d.Stats.map(s => {
    const pl = {};
    s.PlayersStats.forEach(p => pl[p.Player_ID.replace(/^P/, "").trim()] = {pir:p.Valuation, min:p.Minutes});
    return {pts: +(s.totr?.Points || 0), pl};
  });
  const tot = teams[0].pts + teams[1].pts;
  const b = {live: !!d.Live, final: !d.Live && tot > 0, pending: !d.Live && tot === 0, teams};
  if (b.live){ try{ const h = await getJSON(`${LIVE_API}/Header?gamecode=${g.c}&seasoncode=${SEASON}`); b.q = h?.Quarter; b.t = h?.RemainingPartialTime; }catch{} }
  if (b.final) store.set(key, b);
  return b;
}

/* PIR for one player this round, before the group share (null = not played yet) */
function playerPir(p){
  const g = games.find(g => g.r === round && (g.h.c === p.club || g.a.c === p.club));
  if (!g) return null;
  const b = box[g.c];
  if (!b || b.pending) return null;
  const home = g.h.c === p.club;
  const ti = b.teams[0].pl[p.code] ? 0 : b.teams[1].pl[p.code] ? 1 : (home ? 0 : 1);
  const me = b.teams[ti], them = b.teams[1 - ti], st = me.pl[p.code];
  const played = !!st && !/dnp/i.test(st.min || "");
  const pir = played ? st.pir : 0;
  // live: raw PIR · final: ±10% for the team's win/loss (same rule as the coach page)
  return {f: b.live ? pir : adjustPir(pir, me.pts > them.pts), live: b.live, played};
}
function coachTotal(c){
  let t = 0, live = false;
  const wc = chipsOf(c.name);
  rosterOf(c.name).forEach(p => {
    const share = shareOf(p, wc); if (!share) return;
    const s = playerPir(p); if (s){ t += r1(s.f * share); live ||= s.live; }
  });
  return {total: r1(t), live};
}

function render(){
  $("#roundTxt").textContent = `${SEASON.slice(1)}–${(+SEASON.slice(3) + 1) % 100} · ROUND ${round ?? "–"}`;
  // Teams: round PIR | season total (custom PIR + this round); sorted by the column picked (remembered on this phone)
  const rows = COACHES.map(c => { const r = coachTotal(c), base = baseOf(c); return {...c, team: teamOf(c), ...r, base, sum: r1(base + r.total)}; })
                      .sort((a, b) => sortBy === "total" ? b.sum - a.sum || b.total - a.total : b.total - a.total || b.sum - a.sum);
  if (!editing || !$("#list .team-input")){
    const th = `<div class="th"><div class="rank">#</div><div class="who">TEAM</div>
      <div class="c-rd"><button data-sort="round" class="${sortBy === "round" ? "on" : ""}">ROUND</button></div>
      <div class="c-tot"><button data-sort="total" class="${sortBy === "total" ? "on" : ""}">TOTAL</button></div></div>`;
    $("#list").innerHTML = th + rows.map((c, i) => editing ? `
      <div class="row editing${i === 0 ? " lead" : ""}">
        <div class="rank">${i + 1}</div>
        <div class="who"><input class="team-input" data-coach="${esc(c.name)}" value="${esc(c.team)}" maxlength="40" autocomplete="off" aria-label="Team name">
          <span class="plus-rd">+ ${fmtShort(c.total)} this round</span></div>
        <input class="base-input" data-coach="${esc(c.name)}" value="${c.base || ""}" placeholder="0" inputmode="decimal" autocomplete="off" aria-label="Total for ${esc(c.team)} before this round">
      </div>` : `
      <a class="row${i === 0 ? " lead" : ""}" href="${COACH_PAGE}?coach=${encodeURIComponent(c.name)}">
        <div class="rank">${i + 1}</div>
        <div class="who"><b>${esc(c.team)}</b></div>
        <div class="c-rd">${c.live ? '<i class="live-dot"></i>' : ""}${fmtShort(c.total)}</div>
        <div class="c-tot">${fmtShort(c.sum)}</div>
      </a>`).join("");
  }

  renderTop();
  renderStart();
  renderWatch();
  renderGames();
  if (gOpen) renderGame();
}

/* live games of the round: score + clock; tap → the game's court view in the Game Center */
const clockOf = b => { const q = String(b.q || "").replace(/\D/g, ""); return (q ? (+q > 4 ? "OT" : "Q" + q) : "LIVE") + (b.t && b.t !== "00:00" ? " " + b.t.replace(/^0/, "") : ""); };
function renderGames(){
  if (!games.length) return;
  const now = Date.now();
  const stOf = g => { const b = box[g.c];
    if (b?.live) return {k: 0, live: true, b};
    if (b?.final) return {k: 3, b};
    if (Date.parse(g.u) <= now) return {k: 1};
    return {k: 2}; };
  const rg = games.filter(g => g.r === round).map(g => ({g, s: stOf(g)}))
                  .sort((x, y) => x.s.k - y.s.k || Date.parse(x.g.u) - Date.parse(y.g.u));   // live, starting, upcoming, finished
  if (!rg.length){ $("#gamesList").innerHTML = `<div class="nolive">No games this round.</div>`; return; }
  const fans = g => new Set(COACHES.flatMap(c => rosterOf(c.name)).filter(p => p.club === g.h.c || p.club === g.a.c).map(p => p.code)).size;
  $("#gamesList").innerHTML = rg.map(({g, s}) => {
    const has = !!s.b, hp = has ? s.b.teams[0].pts : "", ap = has ? s.b.teams[1].pts : "";
    const tm = (t, pts, behind) => `<div class="tm${behind ? " behind" : ""}">${t.cr ? `<img src="${esc(t.cr)}" alt="" loading="lazy">` : ""}<b>${esc(t.n || t.tv)}</b>${has ? `<span class="pts">${pts}</span>` : ""}</div>`;
    const st = s.live ? `<span class="s"><i></i>${esc(clockOf(s.b))}</span>` : s.k === 3 ? "FINAL" : s.k === 1 ? "STARTING" : esc(when(g.u));
    const f = fans(g);
    return `<div class="lg${s.live ? " live" : ""}" data-game="${g.c}" role="button" tabindex="0">
      <div class="teams">${tm(g.h, hp, has && hp < ap)}${tm(g.a, ap, has && ap < hp)}</div>
      <div class="st">${st}${f ? `<span class="fan">${f} fantasy</span>` : ""}</div></div>`;
  }).join("");
}
const when = u => new Date(u).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"});

/* ───────── game sheet: score, both box scores, court view (fantasy players marked) ───────── */
const gWrap = $("#gWrap");
let gOpen = null, gView = "box", gSort = {k: "pir", dir: -1}, peopleMap = null;
const loadPeople = () => cached(`elf.people.${SEASON}`, 12 * 3600e3, async () => {     // same list + cache as the coach page
  const nice = s => String(s || "").split(",").map(x => x.trim()).reverse().join(" ").toLowerCase().replace(/(^|[\s'-])\p{L}/gu, c => c.toUpperCase());
  const d = (await getJSON(`${V2}/people?personType=J`)).data;
  const m = new Map();
  d.filter(x => x.active).forEach(x => m.set(x.person.code, {code: x.person.code, name: nice(x.person.name), club: x.club.code, tv: x.club.tvCode || x.club.code,
    clubName: x.club.editorialName || x.club.name, crest: x.club.images?.crest || "", img: x.images?.headshot || "", pos: (x.positionName || "–").charAt(0)}));
  return [...m.values()];
});
function owners(){                                    // player code → fantasy teams that have him
  const m = new Map();
  COACHES.forEach(c => rosterOf(c.name).forEach(p => { const l = m.get(p.code) || []; l.push(teamOf(c)); m.set(p.code, l); }));
  return m;
}
function openGame(gc){
  gOpen = games.find(g => g.c === gc); if (!gOpen) return;
  gView = box[gc]?.live ? "court" : "box";
  gWrap.classList.add("open");
  $("#gBody").scrollTop = 0;
  if (!peopleMap) loadPeople().then(l => { peopleMap = new Map(l.map(p => [p.code, p])); if (gOpen) renderGame(); }).catch(() => {});
  renderGame();
}
function closeGame(){ gWrap.classList.remove("open"); gOpen = null; }
const sign = v => v > 0 ? "+" + v : String(v);
const shortName = n => { const w = String(n || "").split(" "); return w.length > 1 ? `${w[0][0]}. ${w.slice(1).join(" ")}` : n; };
const TM_COLS = [["min", "MIN"], ["pts", "PTS"], ["fg2", "2FG"], ["fg3", "3FG"], ["ft", "FT"], ["tr", "REB"], ["ast", "AST"], ["stl", "STL"],
                 ["to", "TO"], ["blk", "BLK"], ["pf", "PF"], ["pm", "+/−"], ["pir", "PIR"]];
let gSeq = 0;
async function renderGame(){
  const g = gOpen; if (!g) return;
  const seq = ++gSeq, started = Date.parse(g.u) <= Date.now();
  let b = null;
  if (started){ try{ b = await ElData.box(g.c); }catch{} }
  if (seq !== gSeq || gOpen !== g) return;
  const has = b && !b.pending && b.teams?.length === 2;
  const side = t => `<div class="side">${t.cr ? `<img src="${esc(t.cr)}" alt="">` : ""}<b>${esc(t.n || t.tv)}</b></div>`;
  $("#board").innerHTML = `${side(g.h)}<div class="mid"><div class="sc">${has ? `${b.teams[0].pts} – ${b.teams[1].pts}` : "vs"}</div>
      <small class="${b?.live ? "lv" : ""}">${b?.live ? esc(clockOf(b)) : has ? "FINAL" : started ? "STARTING" : esc(when(g.u))}</small></div>${side(g.a)}`;
  document.querySelectorAll("#gSeg [data-v]").forEach(x => x.classList.toggle("on", x.dataset.v === gView));
  const body = $("#gBody"), y = body.scrollTop, xs = [...body.querySelectorAll(".tmw")].map(w => w.scrollLeft);
  let html;
  if (!started) html = `<div class="empty">Box scores show up once the game starts.</div>`;
  else if (!has) html = `<div class="empty">${b ? "Waiting for the first stats…" : "Couldn't load this game right now."}</div>`;
  else {
    const own = owners();
    html = gView === "box" ? [0, 1].map(i => boxTable(b, i, i ? g.a : g.h, own)).join("")
         : [1, 0].map(i => courtHalf(b, i, i ? g.a : g.h, own)).join("")
           + `<div class="note">${b.live ? "Live: the five on court for each team, with their PIR." : "Game over: the starting fives, with their final PIR."} Orange = on a fantasy roster.</div>`;
  }
  if (body._html !== html){                           // live updates: redraw only on change, keep where you've scrolled
    body.innerHTML = body._html = html;
    body.querySelectorAll(".tmw").forEach((w, i) => w.scrollLeft = xs[i] || 0);
    body.scrollTop = y;
  }
}
function boxTable(b, i, t, own){
  const T = b.teams[i];
  const val = (l, k) => k === "min" ? l.mins : k === "fg2" ? l.fg2m : k === "fg3" ? l.fg3m : k === "ft" ? l.ftm : l[k];
  const rows = Object.entries(T.pl).map(([code, l]) => ({code, l, dnp: l.min === "DNP" || !l.mins}))
    .sort((x, y) => (x.dnp - y.dnp) || gSort.dir * (val(x.l, gSort.k) - val(y.l, gSort.k)) || y.l.mins - x.l.mins);
  const cell = (l, k) => k === "min" ? esc(l.min) : k === "fg2" ? `${l.fg2m}/${l.fg2a}` : k === "fg3" ? `${l.fg3m}/${l.fg3a}` : k === "ft" ? `${l.ftm}/${l.fta}` : k === "pm" ? sign(l.pm) : l[k];
  return `<div class="bx"><h3>${t.cr ? `<img src="${esc(t.cr)}" alt="">` : ""}${esc(t.n || t.tv)}<span>${T.pts}</span></h3>
    <div class="tmw"><table class="tmt"><thead><tr><th>Player</th>
      ${TM_COLS.map(([k, lab]) => `<th data-sort="${k}" class="${gSort.k === k ? "on" + (gSort.dir > 0 ? " asc" : "") : ""}">${lab}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(({code, l, dnp}) => { const o = own.get(code); return `<tr class="${o ? "fan" : ""}${dnp ? " dnp" : ""}">
      <td><span class="no">${esc(l.no)}</span>${esc(shortName(l.name))}${b.live && l.on ? '<i class="oc" title="On court"></i>' : ""}${o ? `<small>${esc(o.join(", "))}</small>` : ""}</td>
      ${dnp ? `<td colspan="${TM_COLS.length}" style="text-align:left">DNP</td>` : TM_COLS.map(([k]) => `<td class="${k}">${cell(l, k)}</td>`).join("")}</tr>`; }).join("")}
    </tbody></table></div></div>`;
}
// spots on the half court (basket at the top), two rows so the chips never overlap
const SPOTS = [[50, 27], [17, 33], [83, 33], [31, 76], [69, 76]];
const POS_RANK = {C: 0, F: 1, G: 2};
function courtHalf(b, i, t, own){
  const T = b.teams[i], pp = code => peopleMap?.get(code) || {};
  const five = Object.entries(T.pl).filter(([, l]) => b.live ? l.on : l.starter)
    .sort(([a], [c]) => (POS_RANK[pp(a).pos] ?? 1) - (POS_RANK[pp(c).pos] ?? 1)).slice(0, 5);
  const chips = five.map(([code, l], k) => {
    const o = own.get(code), p = pp(code), [x, y] = SPOTS[k];
    const ini = esc((l.name || "").split(" ").map(w => w[0]).slice(0, 2).join(""));
    return `<div class="pc${o ? " fan" : ""}" style="left:${x}%;top:${y}%">
      <div class="ph">${ini}${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
      ${o ? `<span class="own">${esc(o[0])}${o.length > 1 ? " +" + (o.length - 1) : ""}</span>` : ""}
      <b>${esc(shortName(l.name))}</b><span class="v">${l.pir} PIR</span></div>`;
  }).join("");
  return `<div class="court"><h3>${t.cr ? `<img src="${esc(t.cr)}" alt="">` : ""}${esc(t.n || t.tv)}<small>${b.live ? "on court" : "starting five"}</small></h3>
    <div class="floor">${chips}</div>${five.length ? "" : `<div class="note">No line-up yet.</div>`}</div>`;
}
$("#gamesList").addEventListener("click", e => { const c = e.target.closest("[data-game]"); if (c) openGame(+c.dataset.game); });
$("#gamesList").addEventListener("keydown", e => { const c = e.target.closest("[data-game]"); if (c && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openGame(+c.dataset.game); } });
gWrap.querySelectorAll("[data-gclose]").forEach(x => x.onclick = closeGame);
document.addEventListener("keydown", e => { if (e.key === "Escape" && gOpen) closeGame(); });
$("#gSeg").addEventListener("click", e => { const x = e.target.closest("[data-v]"); if (!x) return; gView = x.dataset.v; $("#gBody").scrollTop = 0; renderGame(); });
$("#gBody").addEventListener("click", e => {
  const th = e.target.closest(".tmt th[data-sort]"); if (!th) return;
  const k = th.dataset.sort; gSort = gSort.k === k ? {k, dir: -gSort.dir} : {k, dir: -1};
  renderGame();
});
// drag the grab bar or the score down to close (a short drag springs back)
(function(){
  const sh = gWrap.querySelector(".sheet");
  let y0 = 0, dy = 0, t0 = 0, id = null;
  const end = () => {
    if (id == null) return;
    id = null; sh.classList.remove("dragging");
    const fast = dy > 30 && dy / Math.max(1, Date.now() - t0) > 0.5;
    sh.style.transform = "";
    if (dy > Math.min(140, sh.offsetHeight * 0.25) || fast) closeGame();
  };
  sh.querySelectorAll(".grab, .board").forEach(h => {
    h.addEventListener("pointerdown", e => { id = e.pointerId; y0 = e.clientY; dy = 0; t0 = Date.now(); sh.classList.add("dragging"); h.setPointerCapture(id); });
    h.addEventListener("pointermove", e => { if (e.pointerId !== id) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translate(-50%, ${dy}px)`; });
    h.addEventListener("pointerup", end);
    h.addEventListener("pointercancel", end);
  });
})();

/* private watch team summary (players are only on this phone; not part of the standings) */
function renderWatch(){
  $("#watchRow").href = `${COACH_PAGE}?coach=watch`;
  const w = store.get("elf.watch", []);
  let t = 0, n = 0, live = false;
  if (games.length) w.forEach(p => { const s = playerPir(p); if (s && s.played){ t += s.f; n++; live ||= s.live; } });
  $("#watchSub").textContent = w.length ? `Only on this phone · ${w.length} player${w.length === 1 ? "" : "s"}${n ? ` · ${n} played` : ""}` : "Only on this phone · follow any players";
  $("#watchVal").innerHTML = (n ? `${live ? '<i class="live-dot"></i>' : ""}${fmtShort(t)}` : "") + `<span class="chev">›</span>`;
}
/* top 10 players of the round among everyone's rosters (hidden until someone has played) */
function renderTop(){
  const seen = new Map();
  COACHES.forEach(c => rosterOf(c.name).forEach(p => {
    const s = games.length ? playerPir(p) : null;
    if (!s || !s.played) return;
    const e = seen.get(p.code);
    if (e) e.teams.push(teamOf(c)); else seen.set(p.code, {p, s, teams:[teamOf(c)]});
  }));
  const top = [...seen.values()].sort((a, b) => b.s.f - a.s.f).slice(0, 10);
  if (!top.length){ $("#topList").innerHTML = `<div class="nolive">No live games yet — the round's top players show up once games start.</div>`; return; }
  $("#topList").innerHTML = top.map(({p, s, teams}, i) => `
    <div class="row pl">
      <div class="rank"${i === 0 ? ' style="color:var(--orange)"' : ""}>${i + 1}</div>
      <div class="ph">${esc((p.name || "").split(" ").map(w => w[0]).slice(0, 2).join(""))}${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
      <div class="who"><b>${esc(p.name)}</b><small><span class="tv">${esc(p.tv || "")}</span> · ${esc(teams.join(", "))}</small></div>
      <div class="score">${s.live ? '<i class="live-dot"></i>' : ""}${fmtShort(s.f)}</div>
    </div>`).join("");
}

/* ───────── refresh loop ───────── */
function relevantGames(){
  const clubs = new Set([...COACHES.flatMap(c => rosterOf(c.name).map(p => p.club)), ...store.get("elf.watch", []).map(p => p.club)]);
  return games.filter(g => g.r === round && (clubs.has(g.h.c) || clubs.has(g.a.c)));
}
async function refresh(){
  if (!games.length) return;
  // every started game of the round (not just ours): the Start button waits for all of them
  const need = games.filter(g => g.r === round && new Date(g.u) <= new Date() && !(box[g.c] && box[g.c].final));
  const res = await Promise.all(need.map(g => loadBox(g).then(b => [g.c, b]).catch(() => [g.c, box[g.c]])));
  res.forEach(([c, b]) => { if (b) box[c] = b; });
  render();
  clearTimeout(timer);
  if (document.hidden) return;
  const now = Date.now(), rel = relevantGames();
  const inPlay = games.some(g => g.r === round && new Date(g.u) <= now && !(box[g.c] && box[g.c].final));
  const next = rel.map(g => +new Date(g.u)).filter(t => t > now).sort((a, b) => a - b)[0];
  timer = setTimeout(refresh, inPlay ? LIVE_POLL : next ? Math.min(IDLE_POLL, Math.max(10_000, next - now + 5_000)) : IDLE_POLL);
}
document.addEventListener("visibilitychange", () => document.hidden ? clearTimeout(timer) : refresh());

$("#list").addEventListener("input", e => {
  const inp = e.target.closest(".team-input"); if (!inp) return;
  const names = store.get("elf.teams", {});
  const v = inp.value.trim();
  const def = DEFAULT_COACHES.find(c => c.name === inp.dataset.coach)?.team;
  if (v && v !== def) names[inp.dataset.coach] = v; else delete names[inp.dataset.coach];
  store.set("elf.teams", names);
  clearTimeout(inp._t);                 // save for everyone shortly after typing stops
  inp._t = setTimeout(() => Shared.push(inp.dataset.coach, {team: v && v !== def ? v : ""}), 400);
});

$("#list").addEventListener("input", e => {
  const inp = e.target.closest(".base-input"); if (!inp) return;
  const raw = inp.value.replace(",", ".").trim();
  const v = raw === "" ? 0 : Number(raw);
  if (!Number.isFinite(v)) return;
  const all = store.get("elf.base", {}); all[inp.dataset.coach] = v; store.set("elf.base", all);
  clearTimeout(inp._t);
  inp._t = setTimeout(() => Shared.push(inp.dataset.coach, {base: v}), 400);
});
$("#list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".base-input")) e.target.blur(); });
$("#list").addEventListener("click", e => {             // tap ROUND / TOTAL to sort by it
  const b = e.target.closest("[data-sort]"); if (!b) return;
  e.preventDefault(); sortBy = b.dataset.sort;
  try{ localStorage.setItem("elf.teamsSort", sortBy); }catch{}
  render();
});

/* Teams / Games / Players tabs (remembered on this phone) */
const VIEWS = ["teams", "games", "players"];
let view = "teams", sortBy = "round";
try{ const v = localStorage.getItem("elf.leagueTab"); if (VIEWS.includes(v)) view = v; sortBy = localStorage.getItem("elf.teamsSort") === "total" ? "total" : "round"; }catch{}
function showView(){
  $("#vTeams").hidden = view !== "teams";
  $("#vGames").hidden = view !== "games";
  $("#vPlayers").hidden = view !== "players";
  document.querySelectorAll("#seg [data-view]").forEach(b => { b.classList.toggle("on", b.dataset.view === view); b.setAttribute("aria-selected", b.dataset.view === view); });
}
$("#seg").addEventListener("click", e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  view = b.dataset.view;
  try{ localStorage.setItem("elf.leagueTab", view); }catch{}
  showView();
});
showView();


/* ───────── Start Round X ─────────
   Shows once every game of the league's round is over. Any 2 phones tapping it start the next round:
   the server adds each team's round PIR to its Total, rosters stay, and the round number moves on.
   Tapping again takes the vote back. If nobody taps, the server starts it 3 h before the next round tips off. */
const DEVICE = (() => {
  let id = store.get("elf.device");
  if (!/^[a-z0-9]{8,40}$/.test(id || "")){ id = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => b.toString(36).padStart(2, "0")).join("").slice(0, 16); store.set("elf.device", id); }
  return id;
})();
let voting = false;
const roundOver = () => {
  const rg = games.filter(g => g.r === round);
  return rg.length > 0 && rg.every(g => g.p || (box[g.c] && box[g.c].final));
};
function renderStart(){
  const L = Shared.enabled && Shared.ready ? Shared.league : null;
  const show = !!L && L.round === round && roundOver();
  $("#startWrap").hidden = !show;
  if (!show) return;
  const votes = L.votes || [], mine = votes.includes(DEVICE), b = $("#startBtn");
  b.classList.toggle("voted", mine);
  b.disabled = voting;
  b.textContent = mine ? "✓ Ready" : `Start Round ${round + 1}`;
  $("#startNote").textContent = (votes.length ? `${votes.length} ready, ` : "") + `${Math.max(0, 2 - votes.length)} more to start` + (mine ? ". Tap to undo" : "");
}
$("#startBtn").onclick = async () => {
  const L = Shared.league; if (!L || voting) return;
  const vote = !(L.votes || []).includes(DEVICE);
  voting = true;
  L.votes = vote ? [...(L.votes || []), DEVICE] : (L.votes || []).filter(d => d !== DEVICE);   // show it right away
  renderStart();
  try{
    const r = await fetch("/api/round", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({device:DEVICE, round:L.round, vote})});
    if (!r.ok) throw new Error(r.status);
  }catch{ alertNote("Couldn't reach the server — try again"); }
  voting = false;
  Shared.refresh();
};
function alertNote(t){ $("#startNote").textContent = t; }

/* edits from anyone arrive here */
Shared.on(first => {
  if (first && Shared.enabled){        // upload names renamed on this phone before sharing existed
    const names = store.get("elf.teams", {});
    COACHES.forEach(c => { if (names[c.name] && !Shared.coaches[c.name]?.team) Shared.push(c.name, {team: names[c.name]}); });
  }
  if (Shared.league?.round && games.length && round !== Shared.league.round) round = Shared.league.round;   // next round started
  render(); refresh();
});
$("#list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".team-input")) e.target.blur(); });

async function boot(){
  render();
  Shared.start();
  try{
    games = await loadGames();
    const started = games.filter(g => new Date(g.u) <= new Date());
    round = Shared.league?.round       // the league's round (moves on with Start Round X)
      ?? (started.length ? Math.max(...started.map(g => g.r)) : Math.min(...games.map(g => g.r)));
  }catch{ render(); return; }
  refresh();
}
boot();
</script>
</body>
</html>
