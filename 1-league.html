<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<!-- home-screen app: stay full-screen when moving between pages (iOS + Android) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EL Fantasy">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<title>League · EL Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --card:#18181B; --card-2:#232327; --line:#2B2B30; --text:#FFFFFF; --muted:#9A9AA3; --dim:#5E5E66;
    --orange:#FF6B1A;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;font-variant-numeric:tabular-nums}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px 40px}

  /* header */
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:40px;height:40px;flex:none;display:block}
  .titles{flex:1;min-width:0}
  .icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;flex:none;font-family:inherit}
  .icon-btn.on{background:var(--orange);border-color:var(--orange);font-size:20px;font-weight:800}
  header h1{font-weight:800;font-size:19px;letter-spacing:.02em;line-height:1}
  header small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px;letter-spacing:.04em}

  /* standings */
  .list{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .row:first-child{border-top:0}
  .row:active{background:#1F1F23}
  .rank{width:24px;font-weight:800;font-size:18px;color:var(--dim);text-align:center;flex:none}

  /* 1st place: hero row with the background art */
  .row.lead{position:relative;align-items:center;min-height:72px;padding:14px 16px;
            background:url("assets/bg.jpg") center 35%/cover}
  .row.lead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0A0A0B1A 0%,#0A0A0B80 55%,#0A0A0BE6 100%)}
  .row.lead > *{position:relative;z-index:1}
  .row.lead .rank{color:var(--orange)}
  .row.lead .lbl{display:block;font-size:10.5px;letter-spacing:.14em;color:#FFFFFFB3;font-weight:700;margin-bottom:4px}
  .row.lead .chev{color:#FFFFFF99}
  .row.lead .live-dot{vertical-align:middle;margin-right:4px}
  .row.lead.editing{min-height:0;align-items:center}
  .row.editing .who b{font-size:16px}
  .who{flex:1;min-width:0}
  .who b{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .score{font-size:21px;font-weight:800;text-align:right;flex:none;display:flex;align-items:center;gap:8px}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);animation:pulse 1.4s infinite}
  .chev{color:var(--dim);font-size:20px;margin-left:2px}
  .team-input{width:100%;height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-2);color:#fff;
              font:700 16px Inter,system-ui,sans-serif;padding:0 12px}
  .team-input:focus{outline:none;border-color:var(--orange)}
  /* Start Round X — appears when every game of the round is over; 2 phones start the next round */
  .start{margin:-2px 0 14px}
  .start-btn{width:100%;height:48px;border:0;border-radius:14px;background:var(--orange);color:#fff;font:800 16px Inter,system-ui,sans-serif;
             letter-spacing:.3px;cursor:pointer;box-shadow:0 6px 20px #FF6B1A33;display:flex;align-items:center;justify-content:center;gap:10px;
             transition:transform .1s,background .15s,box-shadow .15s}
  .start-btn:active{transform:scale(.98)}
  .start-btn.voted{background:var(--card);border:2px solid var(--orange);color:var(--orange);box-shadow:none}
  .start-btn:disabled{opacity:.6}
  .start-note{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-top:8px}
  .seg{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
  .seg button{flex:1;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 14px Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s,color .15s}
  .seg button.on{background:var(--orange);color:#fff}
  .sec-t{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin:26px 4px 10px}
  .base-input{width:104px;height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-2);color:#fff;
              font:800 18px Inter,system-ui,sans-serif;padding:0 12px;text-align:right;flex:none}
  .base-input:focus{outline:none;border-color:var(--orange)}
  .pl .ph{width:38px;height:38px;border-radius:50%;background:var(--card-2);flex:none;overflow:hidden;position:relative;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
  .pl .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
  .pl .who small{color:var(--muted)}
  .pl .tv{font-weight:700;color:#C9C9CF}
  .row .plus-rd{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
  .row.editing{cursor:default}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #FF6B1A99}70%{box-shadow:0 0 0 7px #FF6B1A00}100%{box-shadow:0 0 0 0 #FF6B1A00}}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="assets/euroleague.svg" alt="">
    <div class="titles"><h1>EUROLEAGUE FANTASY</h1><small id="roundTxt">2026–27 · ROUND –</small></div>
    <button class="icon-btn" id="editBtn" aria-label="Edit team names and custom PIR">✎</button>
  </header>

  <div class="start" id="startWrap" hidden>
    <button class="start-btn" id="startBtn"></button>
    <div class="start-note" id="startNote"></div>
  </div>

  <div class="seg" role="tablist" id="seg">
    <button role="tab" data-view="round">Round</button>
    <button role="tab" data-view="total">Total</button>
  </div>
  <div class="list" id="list"></div>

  <div class="list" id="totalList" hidden></div>

  <div id="topWrap" hidden>
    <div class="sec-t" id="topTitle">TOP 10 PLAYERS</div>
    <div class="list" id="topList"></div>
  </div>
</div>

<script src="assets/sync.js"></script>
<script>
/* ───────── league (hardcoded) ───────── */
const DEFAULT_COACHES = [
  {name:"Justelis", team:"SPEEDsters"},
  {name:"Darius",   team:"SPERMOS VAIKAI"},
  {name:"Deivis",   team:"Kundžiai"},
  {name:"Novikas",  team:"Vilkmergė"},
  {name:"Titas",    team:"Geri Sprendimai 0.7"},
  {name:"Saimonas", team:"KĖDAINIETIS"},
];
// roster storage stays keyed by coach name; team names can be renamed (shared with everyone via assets/sync.js)
const live = name => (Shared.enabled && Shared.ready) ? (Shared.coaches[name] || {}) : null;
const teamOf = c => { const d = live(c.name); return (d ? d.team : store.get("elf.teams", {})[c.name]) || c.team; };
// custom PIR (set by hand in edit mode) — the total list shows custom PIR + this round's PIR
const baseOf = c => { const d = live(c.name); return +(d ? d.base : store.get("elf.base", {})[c.name]) || 0; };
const COACHES = DEFAULT_COACHES;
let editing = false;

/* ───────── config (same as coach page) ───────── */
const today = new Date();
const SEASON = "E" + (today.getMonth() >= 6 ? today.getFullYear() : today.getFullYear() - 1);
// On the website, API calls go through the Worker's proxy (/el-api, /el-live). Local file → direct.
const DIRECT = location.protocol === "file:";
const COACH_PAGE = DIRECT ? "2-coach.html" : "/2-coach";   // same-origin, no redirect hop (keeps the home-screen app full-screen)
const V2 = `${DIRECT ? "https://api-live.euroleague.net" : "/el-api"}/v2/competitions/E/seasons/${SEASON}`;
const LIVE_API = DIRECT ? "https://live.euroleague.net/api" : "/el-live";
const LIVE_POLL = 30_000, IDLE_POLL = 5 * 60_000;
// group share of a player's PIR (older saved rosters used active/bench/inactive)
const MULT = {full:1, half:0.5, zero:0, active:1, bench:0.5, inactive:0};

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const $ = s => document.querySelector(s);
const r1 = v => Math.round(v * 100) / 100;          // values are kept to 2 decimals; only display rounds further
const fmtShort = v => r1(v).toFixed(1);               // cards, lists, totals: 14.3
const fmtFull  = v => r1(v).toFixed(2);               // detail views: 14.30
// team-result adjustment: ±10% of the absolute PIR, so negatives move the right way (−5 → −4.5 on a win, −5.5 on a loss)
const adjustPir = (raw, win) => r1(raw + (win ? 1 : -1) * Math.abs(raw) * 0.1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rosterOf = name => live(name)?.roster || store.get(`elf.roster.${name}`, []);
// share of a player's PIR — same rules as the coach page:
// group (100/50/0; Bench Boost lifts 50% → 100%) × captain (2×, Triple Captain 3×)
const chipsOf = name => (round != null && (live(name)?.chips || store.get(`elf.chips.${name}`, {}))[round]) || {};
function shareOf(p, wc){
  const slot = p.slot || (p.active === false ? "zero" : "full");
  const group = (slot === "half" || slot === "bench") ? (wc.bb ? 1 : 0.5) : (MULT[slot] ?? 0);
  const full = slot === "full" || slot === "active";
  return group * (p.captain && full ? (wc.tc ? 3 : 2) : 1);
}

let games = [], round = null, box = {}, timer = null;

async function getJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error(r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function cached(key, ttl, loader){
  const c = store.get(key);
  if (c && Date.now() - c.t < ttl) return c.v;
  try{ const v = await loader(); store.set(key, {t:Date.now(), v}); return v; }
  catch(e){ if (c) return c.v; throw e; }
}
const loadGames = () => cached(`elf.games.${SEASON}`, 10 * 60e3, async () => {
  const d = (await getJSON(`${V2}/games`)).data;
  const side = s => ({c:s.club.code, tv:s.club.tvCode || s.club.code});
  return d.map(x => ({c:x.gameCode, r:x.round, u:x.utcDate, p:x.played, h:side(x.local), a:side(x.road)}));
});
async function loadBox(g){
  const key = `elf.box.${SEASON}.${g.c}`;
  const c = store.get(key);
  if (c && c.final) return c;
  const d = await getJSON(`${LIVE_API}/Boxscore?gamecode=${g.c}&seasoncode=${SEASON}`);
  if (!d || !d.Stats || d.Stats.length < 2) return {pending:true};
  const teams = d.Stats.map(s => {
    const pl = {};
    s.PlayersStats.forEach(p => pl[p.Player_ID.replace(/^P/, "").trim()] = {pir:p.Valuation, min:p.Minutes});
    return {pts: +(s.totr?.Points || 0), pl};
  });
  const tot = teams[0].pts + teams[1].pts;
  const b = {live: !!d.Live, final: !d.Live && tot > 0, pending: !d.Live && tot === 0, teams};
  if (b.final) store.set(key, b);
  return b;
}

/* PIR for one player this round, before the group share (null = not played yet) */
function playerPir(p){
  const g = games.find(g => g.r === round && (g.h.c === p.club || g.a.c === p.club));
  if (!g) return null;
  const b = box[g.c];
  if (!b || b.pending) return null;
  const home = g.h.c === p.club;
  const ti = b.teams[0].pl[p.code] ? 0 : b.teams[1].pl[p.code] ? 1 : (home ? 0 : 1);
  const me = b.teams[ti], them = b.teams[1 - ti], st = me.pl[p.code];
  const played = !!st && !/dnp/i.test(st.min || "");
  const pir = played ? st.pir : 0;
  // live: raw PIR · final: ±10% for the team's win/loss (same rule as the coach page)
  return {f: b.live ? pir : adjustPir(pir, me.pts > them.pts), live: b.live, played};
}
function coachTotal(c){
  let t = 0, live = false;
  const wc = chipsOf(c.name);
  rosterOf(c.name).forEach(p => {
    const share = shareOf(p, wc); if (!share) return;
    const s = playerPir(p); if (s){ t += r1(s.f * share); live ||= s.live; }
  });
  return {total: r1(t), live};
}

function render(){
  $("#roundTxt").textContent = `${SEASON.slice(1)}–${(+SEASON.slice(3) + 1) % 100} · ROUND ${round ?? "–"}`;
  const rows = COACHES.map(c => ({...c, team: teamOf(c), ...coachTotal(c)})).sort((a, b) => b.total - a.total);
  if (!editing || !$("#list .team-input")){
    $("#list").innerHTML = rows.map((c, i) => editing ? `
      <div class="row editing${i === 0 ? " lead" : ""}">
        <div class="rank">${i + 1}</div>
        <div class="who"><input class="team-input" data-coach="${esc(c.name)}" value="${esc(c.team)}" maxlength="40" autocomplete="off" aria-label="Team name"></div>
      </div>` : `
      <a class="row${i === 0 ? " lead" : ""}" href="${COACH_PAGE}?coach=${encodeURIComponent(c.name)}">
        <div class="rank">${i + 1}</div>
        <div class="who"><b>${esc(c.team)}</b></div>
        <div class="score">${i === 0 ? `<div>${c.live ? '<i class="live-dot"></i> ' : ""}${fmtShort(c.total)}</div>` : `${c.live ? '<i class="live-dot"></i>' : ""}${fmtShort(c.total)}`}<span class="chev">›</span></div>
      </a>`).join("");
  }

  renderTop();
  renderStart();

  // season total = custom PIR + this round's PIR
  const tot = rows.map(c => ({...c, base: baseOf(c), sum: r1(baseOf(c) + c.total)})).sort((a, b) => b.sum - a.sum);
  if (!editing || !$("#totalList .base-input")){
    $("#totalList").innerHTML = tot.map((c, i) => editing ? `
      <div class="row editing${i === 0 ? " lead" : ""}">
        <div class="rank">${i + 1}</div>
        <div class="who"><b>${esc(c.team)}</b><span class="plus-rd">+ ${fmtShort(c.total)} this round</span></div>
        <input class="base-input" data-coach="${esc(c.name)}" value="${c.base || ""}" placeholder="0" inputmode="decimal" autocomplete="off" aria-label="Custom PIR for ${esc(c.team)}">
      </div>` : `
      <a class="row${i === 0 ? " lead" : ""}" href="${COACH_PAGE}?coach=${encodeURIComponent(c.name)}">
        <div class="rank">${i + 1}</div>
        <div class="who"><b>${esc(c.team)}</b></div>
        <div class="score">${i === 0 ? `<div>${c.live ? '<i class="live-dot"></i> ' : ""}${fmtShort(c.sum)}</div>` : `${c.live ? '<i class="live-dot"></i>' : ""}${fmtShort(c.sum)}`}<span class="chev">›</span></div>
      </a>`).join("");
  }
}

/* top 10 players of the round among everyone's rosters (hidden until someone has played) */
function renderTop(){
  const seen = new Map();
  COACHES.forEach(c => rosterOf(c.name).forEach(p => {
    const s = games.length ? playerPir(p) : null;
    if (!s || !s.played) return;
    const e = seen.get(p.code);
    if (e) e.teams.push(teamOf(c)); else seen.set(p.code, {p, s, teams:[teamOf(c)]});
  }));
  const top = [...seen.values()].sort((a, b) => b.s.f - a.s.f).slice(0, 10);
  $("#topWrap").hidden = !top.length;
  $("#topTitle").textContent = `TOP 10 PLAYERS · ROUND ${round ?? "–"}`;
  $("#topList").innerHTML = top.map(({p, s, teams}, i) => `
    <div class="row pl">
      <div class="rank"${i === 0 ? ' style="color:var(--orange)"' : ""}>${i + 1}</div>
      <div class="ph">${esc((p.name || "").split(" ").map(w => w[0]).slice(0, 2).join(""))}${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
      <div class="who"><b>${esc(p.name)}</b><small><span class="tv">${esc(p.tv || "")}</span> · ${esc(teams.join(", "))}</small></div>
      <div class="score">${s.live ? '<i class="live-dot"></i>' : ""}${fmtShort(s.f)}</div>
    </div>`).join("");
}

/* ───────── refresh loop ───────── */
function relevantGames(){
  const clubs = new Set(COACHES.flatMap(c => rosterOf(c.name).map(p => p.club)));
  return games.filter(g => g.r === round && (clubs.has(g.h.c) || clubs.has(g.a.c)));
}
async function refresh(){
  if (!games.length) return;
  // every started game of the round (not just ours): the Start button waits for all of them
  const need = games.filter(g => g.r === round && new Date(g.u) <= new Date() && !(box[g.c] && box[g.c].final));
  const res = await Promise.all(need.map(g => loadBox(g).then(b => [g.c, b]).catch(() => [g.c, box[g.c]])));
  res.forEach(([c, b]) => { if (b) box[c] = b; });
  render();
  clearTimeout(timer);
  if (document.hidden) return;
  const now = Date.now(), rel = relevantGames();
  const inPlay = games.some(g => g.r === round && new Date(g.u) <= now && !(box[g.c] && box[g.c].final));
  const next = rel.map(g => +new Date(g.u)).filter(t => t > now).sort((a, b) => a - b)[0];
  timer = setTimeout(refresh, inPlay ? LIVE_POLL : next ? Math.min(IDLE_POLL, Math.max(10_000, next - now + 5_000)) : IDLE_POLL);
}
document.addEventListener("visibilitychange", () => document.hidden ? clearTimeout(timer) : refresh());

/* edit team names */
$("#editBtn").onclick = () => {
  editing = !editing;
  const b = $("#editBtn");
  b.classList.toggle("on", editing);
  b.textContent = editing ? "✓" : "✎";
  b.setAttribute("aria-label", editing ? "Save changes" : "Edit team names and custom PIR");
  $("#list").innerHTML = ""; $("#totalList").innerHTML = "";
  render();
  if (editing) (view === "total" ? $("#totalList .base-input") : $("#list .team-input"))?.focus();
};
$("#list").addEventListener("input", e => {
  const inp = e.target.closest(".team-input"); if (!inp) return;
  const names = store.get("elf.teams", {});
  const v = inp.value.trim();
  const def = DEFAULT_COACHES.find(c => c.name === inp.dataset.coach)?.team;
  if (v && v !== def) names[inp.dataset.coach] = v; else delete names[inp.dataset.coach];
  store.set("elf.teams", names);
  clearTimeout(inp._t);                 // save for everyone shortly after typing stops
  inp._t = setTimeout(() => Shared.push(inp.dataset.coach, {team: v && v !== def ? v : ""}), 400);
});

$("#totalList").addEventListener("input", e => {
  const inp = e.target.closest(".base-input"); if (!inp) return;
  const raw = inp.value.replace(",", ".").trim();
  const v = raw === "" ? 0 : Number(raw);
  if (!Number.isFinite(v)) return;
  const all = store.get("elf.base", {}); all[inp.dataset.coach] = v; store.set("elf.base", all);
  clearTimeout(inp._t);
  inp._t = setTimeout(() => Shared.push(inp.dataset.coach, {base: v}), 400);
});
$("#totalList").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".base-input")) e.target.blur(); });

/* Round / Total switch (remembered on this phone) */
let view = "round";
try{ view = localStorage.getItem("elf.leagueView") === "total" ? "total" : "round"; }catch{}
function showView(){
  $("#list").hidden = view !== "round";
  $("#totalList").hidden = view !== "total";
  document.querySelectorAll("#seg [data-view]").forEach(b => { b.classList.toggle("on", b.dataset.view === view); b.setAttribute("aria-selected", b.dataset.view === view); });
}
$("#seg").addEventListener("click", e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  view = b.dataset.view;
  try{ localStorage.setItem("elf.leagueView", view); }catch{}
  showView();
});
showView();


/* ───────── Start Round X ─────────
   Shows once every game of the league's round is over. Any 2 phones tapping it start the next round:
   the server adds each team's round PIR to its Total, rosters stay, and the round number moves on.
   Tapping again takes the vote back. If nobody taps, the server starts it 3 h before the next round tips off. */
const DEVICE = (() => {
  let id = store.get("elf.device");
  if (!/^[a-z0-9]{8,40}$/.test(id || "")){ id = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => b.toString(36).padStart(2, "0")).join("").slice(0, 16); store.set("elf.device", id); }
  return id;
})();
let voting = false;
const roundOver = () => {
  const rg = games.filter(g => g.r === round);
  return rg.length > 0 && rg.every(g => g.p || (box[g.c] && box[g.c].final));
};
function renderStart(){
  const L = Shared.enabled && Shared.ready ? Shared.league : null;
  const show = !!L && L.round === round && roundOver();
  $("#startWrap").hidden = !show;
  if (!show) return;
  const votes = L.votes || [], mine = votes.includes(DEVICE), b = $("#startBtn");
  b.classList.toggle("voted", mine);
  b.disabled = voting;
  b.textContent = mine ? "✓ Ready" : `Start Round ${round + 1}`;
  $("#startNote").textContent = (votes.length ? `${votes.length} ready, ` : "") + `${Math.max(0, 2 - votes.length)} more to start` + (mine ? ". Tap to undo" : "");
}
$("#startBtn").onclick = async () => {
  const L = Shared.league; if (!L || voting) return;
  const vote = !(L.votes || []).includes(DEVICE);
  voting = true;
  L.votes = vote ? [...(L.votes || []), DEVICE] : (L.votes || []).filter(d => d !== DEVICE);   // show it right away
  renderStart();
  try{
    const r = await fetch("/api/round", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({device:DEVICE, round:L.round, vote})});
    if (!r.ok) throw new Error(r.status);
  }catch{ alertNote("Couldn't reach the server — try again"); }
  voting = false;
  Shared.refresh();
};
function alertNote(t){ $("#startNote").textContent = t; }

/* edits from anyone arrive here */
Shared.on(first => {
  if (first && Shared.enabled){        // upload names renamed on this phone before sharing existed
    const names = store.get("elf.teams", {});
    COACHES.forEach(c => { if (names[c.name] && !Shared.coaches[c.name]?.team) Shared.push(c.name, {team: names[c.name]}); });
  }
  if (Shared.league?.round && games.length && round !== Shared.league.round) round = Shared.league.round;   // next round started
  render(); refresh();
});
$("#list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".team-input")) e.target.blur(); });

async function boot(){
  render();
  Shared.start();
  try{
    games = await loadGames();
    const started = games.filter(g => new Date(g.u) <= new Date());
    round = Shared.league?.round       // the league's round (moves on with Start Round X)
      ?? (started.length ? Math.max(...started.map(g => g.r)) : Math.min(...games.map(g => g.r)));
  }catch{ render(); return; }
  refresh();
}
boot();
</script>
</body>
</html>
