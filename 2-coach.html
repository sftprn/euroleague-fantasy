<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<!-- home-screen app: stay full-screen when moving between pages (iOS + Android) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EL Fantasy">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<title>Roster · EL Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --card:#18181B; --card-2:#232327; --line:#2B2B30; --text:#FFFFFF; --muted:#9A9AA3; --dim:#5E5E66;
    --orange:#FF6B1A; --orange-soft:#FF6B1A22; --win:#3DDC84; --win-soft:#123B2A; --loss:#FF5A4E; --loss-soft:#3D1715; --danger:#8E1B1B;
    --headH:118px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit}

  /* background art: fixed behind everything, fades into the page; never moves when swiping.
     The header paints the identical top slice (same px-based sizes) so lists can scroll under it. */
  .art, .top{background-color:var(--bg);
       background-image:linear-gradient(180deg,#0A0A0B26 0px,#0A0A0B8C 140px,#0A0A0BE6 230px,#0A0A0B 300px), url("assets/bg.jpg");
       background-size:100% 300px, max(100vw, 520px) auto;
       background-position:center top, center -30px;
       background-repeat:no-repeat}
  .art{position:fixed;left:0;right:0;top:0;height:300px;z-index:0;pointer-events:none}
  .top{position:fixed;left:0;right:0;top:0;z-index:4;pointer-events:none;
       padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
       -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 10px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 10px),transparent)}
  .bar{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;pointer-events:auto}
  .icon-btn{width:44px;height:44px;padding:0;line-height:1;border-radius:14px;border:1px solid #FFFFFF22;background:#0A0A0B80;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
            display:grid;place-items:center;text-decoration:none;color:#fff;font-size:24px;font-weight:500;cursor:pointer;flex:none}
  .icon-btn svg{display:block}
  .icon-btn.has-wc{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
  .title{text-align:center;min-width:0;flex:1;padding:0 10px;transition:opacity .16s ease,transform .16s ease}
  .title.fade{opacity:0;transform:translateY(-2px)}
  .title h1{font-size:24px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{margin-top:4px;font-size:13px;font-weight:600;color:#FFFFFFB3;display:flex;justify-content:center;align-items:center;gap:6px;white-space:nowrap}
  .meta b{color:#fff;font-weight:800}
  .meta .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:pulse 1.4s infinite}
  .demo-pill{background:#fff;color:#000;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:5px}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #FF6B1A99}70%{box-shadow:0 0 0 7px #FF6B1A00}100%{box-shadow:0 0 0 0 #FF6B1A00}}

  /* carousel: one full-screen list per coach, swipe sideways */
  .track{position:fixed;inset:0;z-index:1;display:flex;   /* pinned to all screen edges, incl. behind the iPhone home indicator */overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
  .track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
  .page{max-width:480px;margin:0 auto;padding:var(--headH) 16px calc(64px + env(safe-area-inset-bottom))}

  /* dots */
  .dots{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;align-items:center;
        padding:8px 12px;border-radius:999px;background:#0A0A0BB3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #FFFFFF14;z-index:5}
  .dots button.w{background:transparent;box-shadow:inset 0 0 0 1.5px #FFFFFF80}
  .dots button.w.on{background:var(--orange);box-shadow:none}
  .r .add.on{background:var(--card-2);color:var(--win);font-size:16px}
  .dots button{width:7px;height:7px;border-radius:999px;border:0;background:#FFFFFF4D;cursor:pointer;transition:width .2s,background .2s;padding:0}
  .dots button.on{width:20px;background:var(--orange)}

  .banner{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;z-index:6;
          background:var(--danger);color:#fff;font-size:13px;font-weight:500;padding:11px 14px;border-radius:14px;display:none;justify-content:space-between;align-items:center;gap:10px}
  .banner.show{display:flex}
  .banner button{border:0;background:#ffffff26;color:#fff;font-weight:700;font-size:12px;padding:7px 12px;border-radius:9px;cursor:pointer}

  /* players boosted by an active Wild Card get the page's background art */
  .p.wc-card,.p.wc-card.live{background:linear-gradient(90deg,#0A0A0BD9 0%,#0A0A0B99 55%,#0A0A0B66 100%), url("assets/bg.jpg") center 35%/cover}
  .p.wc-card .ph{background:#0A0A0B99}
  .p.wc-card .tv{color:#fff}

  /* the single list */
  .list{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
  .zone{position:relative}
  .zone.drop{box-shadow:inset 0 0 0 2px var(--orange)}
  .gh{display:flex;justify-content:center;align-items:center;padding:11px 14px;background:var(--card-2);font-weight:800;font-size:15px;letter-spacing:.02em;border-top:1px solid var(--line)}
  .zone:first-child .gh{border-top:0}
  .zone.z-zero .gh{color:var(--muted)}

  .p{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;position:relative;
     user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .gh + .p{border-top:0}
  .p:active{background:#1F1F23}
  .phw{position:relative;flex:none}
  .ph{width:46px;height:46px;border-radius:50%;background:var(--card-2);flex:none;overflow:hidden;position:relative;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;-webkit-user-drag:none;pointer-events:none}
  .capt{position:absolute;right:-4px;bottom:-3px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--orange);color:#fff;
        font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--card)}
  .capt.tc{background:linear-gradient(135deg,#A855F7,#EC4899)}      /* Triple Captain */
  .who{flex:1;min-width:0}
  .who b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{margin-top:3px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
  .tv{font-weight:700;color:#C9C9CF}
  .res{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.03em}
  .res.W{background:var(--win-soft);color:var(--win)} .res.L{background:var(--loss-soft);color:var(--loss)} .res.D{background:var(--card-2);color:var(--muted)}
  .val{min-width:56px;text-align:right;font-size:20px;font-weight:800}
  .p.up .val,.p.soon .val,.p.none .val{color:var(--dim);font-weight:700}
  .z-zero .p .val{color:var(--dim)}
  .val.struck{text-decoration:line-through;text-decoration-thickness:2px;color:var(--dim)!important}   /* 0% group: full PIR shown, not counted */
  .z-zero .p .phw,.z-zero .p .who{opacity:.7}

  .p.live{background:linear-gradient(90deg,#FF6B1A1F,transparent 75%)}
  .p.live::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
  .p.live .val{color:var(--orange)}
  .lchip{display:inline-flex;align-items:center;gap:4px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.03em}
  .lchip i{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .score{font-weight:700;color:#fff}
  .score.ahead{color:var(--win)} .score.behind{color:var(--loss)}           /* who's winning */
  .score.fin{font-weight:600}
  /* on court (live): green dot on the photo */
  .oc{position:absolute;left:-1px;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--win);border:2px solid var(--card)}

  .p.empty .ph{background:transparent;border:1.5px dashed #46464D;color:var(--orange);font-size:22px;font-weight:500}
  .p.empty .who b{color:var(--dim);font-weight:600}

  /* drag */
  .p.lifted{opacity:.25}
  .p.drop{box-shadow:inset 0 0 0 2px var(--orange);background:#FF6B1A1A!important;opacity:1!important}      /* swap target */
  .p.ins-before::after,.p.ins-after::after{content:"";position:absolute;left:12px;right:12px;height:3px;border-radius:3px;
    background:var(--orange);box-shadow:0 0 10px #FF6B1A;z-index:2;pointer-events:none}                         /* "lands here" line */
  .p.ins-before::after{top:-2px} .p.ins-after::after{bottom:-2px}
  .ghost{position:fixed;z-index:30;pointer-events:none;margin:0;background:#232327;border:1px solid #3A3A40;border-radius:16px;box-shadow:0 18px 40px #000000AA;transform:scale(1.03) rotate(-1deg);opacity:1!important}
  body.dragging, body.dragging *{cursor:grabbing!important}
  body.dragging .track{overflow:hidden}

  .skel{height:70px;border-top:1px solid var(--line);background:linear-gradient(90deg,#18181B,#232327,#18181B);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}

  /* sheets */
  .scrim{position:fixed;inset:0;background:#000000A6;opacity:0;pointer-events:none;transition:.2s;z-index:10}
  /* sheet = grab area + header (fixed) + body (scrolls when there's too much); never taller than the screen */
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-bottom:0;
         border-radius:24px 24px 0 0;display:flex;flex-direction:column;max-height:calc(100vh - env(safe-area-inset-top) - 16px);max-height:calc(100dvh - env(safe-area-inset-top) - 16px);
         transition:transform .25s ease,visibility .25s;visibility:hidden;z-index:11;overflow:hidden}
  .open .scrim{opacity:1;pointer-events:auto}
  .open .sheet{transform:translate(-50%,0);visibility:visible}
  .sheet.dragging{transition:none}
  .grab{flex:none;height:30px;display:grid;place-items:center;cursor:grab;touch-action:none}
  .grab::before{content:"";width:40px;height:4px;background:#3A3A40;border-radius:4px}
  .sh-head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 20px 14px;border-bottom:1px solid var(--line);touch-action:none}
  .sh-head b{font-size:20px;font-weight:800;display:block}
  .sh-head small{color:var(--muted);font-size:12.5px}
  .sh-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 16px calc(22px + env(safe-area-inset-bottom))}

  /* player sheet header: text on the left, cut-out photo on the right standing on the divider */
  .ph-head{align-items:flex-end;padding:0 0 0 20px;min-height:130px}
  .ph-txt{flex:1;min-width:0;padding:6px 0 18px}
  .ph-txt .big{display:block;font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.01em;color:#fff;overflow-wrap:anywhere}
  .ph-txt .sub{display:block;font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.35;margin-top:3px}
  .ph-txt .big.pir{margin-top:14px}
  .ph-txt .big.pir.none{color:var(--dim)}
  .ph-pic{flex:none;width:150px;height:185px;margin:-14px 8px 0 0;align-self:flex-end;position:relative;overflow:hidden;pointer-events:none;user-select:none}
  .ph-pic[hidden]{display:none}
  /* some photos have empty space under the body: --gap (measured once per photo) pushes it down onto the divider */
  .ph-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;transform:translateY(var(--gap,0px))}
  .act{display:flex;align-items:center;gap:12px;width:100%;padding:13px 6px;border:0;background:none;font-weight:600;font-size:15px;cursor:pointer;border-radius:12px;text-align:left}
  .act:active{background:var(--card-2)}
  .act .ic{width:36px;height:36px;border-radius:11px;background:var(--card-2);display:grid;place-items:center;font-size:15px;font-weight:800;flex:none}
  .act small{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
  .act.capt-act .ic{background:var(--orange);color:#fff}
  .act.danger{color:var(--loss)} .act.danger .ic{background:var(--loss-soft)}
  .act[disabled]{opacity:.35;pointer-events:none}


  /* player sheet tabs */
  .tabs{position:sticky;top:-8px;z-index:2;display:flex;gap:4px;padding:4px;margin:-8px -16px 12px;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px}
  .tabs button{flex:1;height:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 13.5px Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s,color .15s}
  .tabs button.on{background:var(--card-2);color:#fff}
  .pane{min-height:120px}
  .pane .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 10px}
  .pane .loading{color:var(--dim);font-size:13px;text-align:center;padding:26px 10px}
  .gm{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card-2);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .gm .tm{font-weight:800;font-size:15px;min-width:44px} .gm .tm.r{text-align:right}
  .gm .sc{font-weight:800;font-size:22px;letter-spacing:-.01em;text-align:center;flex:1}
  .gm .sc small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-top:2px}
  .gm .sc small.lv{color:var(--orange)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .grid div{background:var(--card-2);border-radius:12px;padding:9px 6px 8px;text-align:center;min-width:0}
  .grid b{display:block;font-size:17px;font-weight:800}
  .grid small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-top:2px}
  .grid em{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:1px}
  .grid .wide{grid-column:span 2}
  .fouls{display:flex;gap:5px;justify-content:center;margin-top:5px}
  .fouls i{width:8px;height:8px;border-radius:50%;background:#3A3A40}
  .fouls i.on{background:#fff} .fouls.warn i.on{background:var(--loss)}
  .tl{position:relative;height:30px;border-radius:8px;background:var(--card-2);overflow:hidden;margin:6px 0 4px}
  .tl .seg{position:absolute;top:0;bottom:0;background:var(--orange);border-radius:3px}
  .tl .q{position:absolute;top:0;bottom:0;width:1px;background:var(--bg)}
  .tl .fut{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,#0000 0 5px,#FFFFFF0D 5px 10px)}
  .tl .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
  .tl-lab{position:relative;height:14px;font-size:10.5px;font-weight:700;color:var(--dim);margin-bottom:12px}
  .tl-lab span{position:absolute;transform:translateX(-50%)}
  .mins-sum{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 2px}
  .mins-sum b{font-size:20px;font-weight:800} .mins-sum small{color:var(--muted);font-size:12.5px}
  .stint{display:flex;justify-content:space-between;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}
  .stint span{color:var(--muted)}
  .avg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .avg div{background:var(--card-2);border-radius:12px;padding:9px 6px 8px;text-align:center}
  .avg b{display:block;font-size:17px;font-weight:800} .avg small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-top:2px}
  .chart{display:flex;align-items:stretch;justify-content:center;gap:3px;height:84px;margin:4px 0 14px;position:relative}
  .chart .col{flex:1;position:relative;min-width:0;max-width:22px}
  .chart .bar{position:absolute;left:0;right:0;border-radius:3px;background:var(--orange)}
  .chart .bar.neg{background:var(--loss)} .chart .bar.dnp{background:#3A3A40}
  .chart .zero{position:absolute;left:0;right:0;height:1px;background:var(--line)}
  .hist{width:100%;border-collapse:collapse;font-size:13.5px}
  .hist th{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
  .hist td{text-align:right;padding:9px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
  .hist th:nth-child(-n+2),.hist td:nth-child(-n+2){text-align:left}
  .hist td.rd{color:var(--muted);width:30px}
  .hist td b{font-weight:800}
  .hist tr.cur td{background:var(--orange-soft)}
  .hist .w{color:var(--win)} .hist .l{color:var(--loss)}
  .hist-note{font-size:11.5px;color:var(--dim);padding:10px 2px 0}

  /* Team tab: his teammates' stat lines; name column stays put, the rest scrolls sideways */
  .tmw{overflow-x:auto;margin:0 -16px;padding:0;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .tmt{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
  .tmt th,.tmt td{padding:9px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  .tmt th{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;cursor:pointer;user-select:none}
  .tmt th.on{color:#fff} .tmt th.on::after{content:" ▾";font-size:9px} .tmt th.on.asc::after{content:" ▴"}
  .tmt th:last-child,.tmt td:last-child{padding-right:16px}
  .tmt th:first-child,.tmt td:first-child{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;max-width:150px;padding-left:16px;overflow:hidden;text-overflow:ellipsis;
    box-shadow:6px 0 8px -6px #00000099}
  .tmt td:first-child span{color:var(--dim);font-size:11px;margin-right:6px;display:inline-block;min-width:14px}
  .tmt td.pir{font-weight:800}
  .tmt tr.me td{background:#2A1A10} .tmt tr.me td:first-child{background:#2A1A10;color:var(--orange);font-weight:800}
  .tmt tr.dnp td{color:var(--dim)}
  .fan{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:5px;vertical-align:middle}
  .tm-note{font-size:11.5px;color:var(--dim);padding:10px 2px 0}

  /* wild card toggles */
  .tg{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;border:0;background:none;text-align:left;cursor:pointer;border-radius:12px}
  .tg:active{background:var(--card-2)}
  .tg .txt{flex:1;min-width:0}
  .tg .txt b{display:block;font-size:16px;font-weight:800}
  .tg .txt small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .sw{width:50px;height:30px;border-radius:999px;background:#3A3A40;position:relative;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
  .tg.on .sw{background:var(--orange)} .tg.on .sw::after{left:23px}

  /* full-screen add overlay */
  .finder{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility .25s}
  .finder.open{transform:none;visibility:visible}
  .finder-in{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100%;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
  .s-row{display:flex;gap:10px;align-items:center;width:100%}
  .searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:50px;border:1.5px solid var(--line);border-radius:15px;padding:0 14px;background:var(--card)}
  .searchbox:focus-within{border-color:var(--orange)}
  .searchbox svg{flex:none;color:var(--muted)}
  .searchbox input{flex:1;min-width:0;border:0;background:none;font:500 16px Inter,system-ui,sans-serif;color:#fff;height:100%}
  .searchbox input::placeholder{color:var(--dim)}
  .searchbox input:focus{outline:none}
  .searchbox input::-webkit-search-cancel-button{display:none}
  .close{width:50px;height:50px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:22px;cursor:pointer;flex:none}
  .s-sub{font-size:12.5px;color:var(--muted);padding:12px 4px 4px}
  .s-sub b{color:var(--orange)}
  .results{flex:1;overflow-y:auto;margin:0 -16px;padding:0 16px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .r{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .r:active{background:#141417}
  .r .crest{width:16px;height:16px;object-fit:contain;vertical-align:-3px}
  .r .add{width:38px;height:38px;border-radius:12px;border:0;background:var(--orange);color:#fff;font-size:22px;font-weight:500;flex:none;cursor:pointer}
  .r.taken{cursor:default}
  .r.taken .add{background:var(--card-2);color:var(--muted);font-size:15px}
  .r .owner{flex:none;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--card-2);padding:5px 8px;border-radius:8px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-hint{padding:40px 10px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5}

  .toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#fff;color:#000;font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:40}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<!-- player actions -->

<!-- full-screen add player -->
<div class="finder" id="finder" role="dialog" aria-label="Add player">
  <div class="finder-in">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search player or team" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </label>

<div class="toast" id="toast"></div>

<script src="assets/demo.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/data.js"></script>
<script>
/* ───────── league (hardcoded, same as the league page) ───────── */
const COACHES = [
  {name:"Justelis", team:"SPEEDsters"},
  {name:"Darius",   team:"SPERMOS VAIKAI"},
  {name:"Deivis",   team:"Kundžiai"},
  {name:"Novikas",  team:"Vilkmergė"},
  {name:"Titas",    team:"Geri Sprendimai 0.7"},
  {name:"Saimonas", team:"KĖDAINIETIS"},
];

/* ───────── config ───────── */
const qs = new URLSearchParams(location.search);
const DEMO = qs.has("demo") && !window.ELF_DEMO;   // plain ?demo → replays the last finished round as if live (?demo=live / ?demo=round: assets/demo.js)
const today = new Date();
const SEASON = "E" + (today.getMonth() >= 6 ? today.getFullYear() : today.getFullYear() - 1);
// On the website, API calls go through Netlify's proxy (see _redirects) — Euroleague's
// servers don't reliably allow browser calls from other sites. Opened as a local file → call directly.
const DIRECT = location.protocol === "file:";
if (DIRECT) document.getElementById("backBtn").href = "1-league.html";   // local file: no server-side clean addresses
const V2 = `${DIRECT ? "https://api-live.euroleague.net" : "/el-api"}/v2/competitions/E/seasons/${SEASON}`;
const LIVE_API = DIRECT ? "https://live.euroleague.net/api" : "/el-live";
const ORDER = ["full", "half", "zero"];
const SLOTS = {full:6, half:4, zero:3};
const LABEL = {full:"100%", half:"50%", zero:"0%"};
const MAX = 13;
const LIVE_POLL = window.ELF_DEMO ? 5_000 : 30_000, IDLE_POLL = 5 * 60_000;

/* ───────── storage: shared server (assets/sync.js) + local cache for instant start/offline ───────── */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const PFX = `elf.${DEMO ? "demo." : ""}`;
const rkey = n => `${PFX}roster.${n}`;
const wkey = n => `${PFX}chips.${n}`;          // wild cards, per coach per round: {"7": {tc:true, bb:false}}
const rosters = {}, chipsAll = {};            // chipsAll: coach → {round: {tc, bb}}
const clone = v => JSON.parse(JSON.stringify(v));
/* Watch team: the last page, any players, followed privately — stored ONLY on this phone (elf.watch), never shared or counted */
const WATCH = "watch", WATCH_MAX = 20;
const persist = n => n === WATCH ? store.set("elf.watch", rosters[WATCH]) : store.set(rkey(n), rosters[n]);   // this device only
const save = n => { persist(n); if (n !== WATCH) Shared.push(n, {roster: clone(rosters[n])}); };   // device + everyone (not the watch team)
const slotCount = (n, s) => rosters[n].filter(p => p.slot === s).length;
const freeSlot = n => ORDER.find(s => slotCount(n, s) < SLOTS[s]);
const LEGACY = {active:"full", bench:"half", inactive:"zero"};
function fixCaptain(n){            // captain: at most one, and only from the 100% group
  let seen = false;
  rosters[n].forEach(p => { if (p.captain && (p.slot !== "full" || seen)) delete p.captain; else if (p.captain) seen = true; });
}
function useRoster(name, list){       // load + migrate rosters saved by earlier versions
  rosters[name] = list;
  list.forEach(p => { if (LEGACY[p.slot]) p.slot = LEGACY[p.slot]; if (!p.slot) p.slot = p.active === false ? "zero" : "full"; delete p.active; });
  ORDER.forEach(s => list.filter(p => p.slot === s).slice(SLOTS[s]).forEach(p => p.slot = null));
  list.filter(p => !p.slot).forEach(p => p.slot = freeSlot(name) || "zero");
  list.forEach((p, k) => { if (!Number.isFinite(p.order)) p.order = (k + 1) * 10; });   // manual order (older rosters: keep list order)
  fixCaptain(name);
  persist(name);
}
COACHES.forEach(({name}) => { useRoster(name, store.get(rkey(name), [])); chipsAll[name] = store.get(wkey(name), {}); });
rosters[WATCH] = store.get("elf.watch", []).map((p, k) => ({...p, slot: "watch", order: Number.isFinite(p.order) ? p.order : (k + 1) * 10}));

/* changes made by anyone arrive here (first = first answer from the server) */
let pendingRemote = false;
function applyShared(first){
  if (drag && drag.on){ pendingRemote = true; return; }        // never reshuffle under a finger
  COACHES.forEach(({name}) => {
    const doc = Shared.coaches[name] || {};
    if (doc.roster) useRoster(name, clone(doc.roster));
    else if (first && rosters[name].length) Shared.push(name, {roster: clone(rosters[name])});   // upload what this phone had
    if (doc.chips){ chipsAll[name] = clone(doc.chips); store.set(wkey(name), chipsAll[name]); }
    else if (first && Object.keys(chipsAll[name]).length) Shared.push(name, {chips: clone(chipsAll[name])});
  });
  if (!built) return;
  if (!DEMO && Shared.league?.round && round !== Shared.league.round) round = Shared.league.round;   // next round started
  if ($("#actWrap").classList.contains("open") && !selected()) $("#actWrap").classList.remove("open");
  if ($("#wcWrap").classList.contains("open")) renderWc();
  if ($("#finder").classList.contains("open")) renderResults();
  render(); refresh();      // show it now; refresh also loads box scores for newly added clubs
}
Shared.on(applyShared);
// team name shown everywhere (same as the League page): shared rename → this phone's rename → default
const teamOf = n => n === WATCH ? "Watch team" : ((Shared.enabled && Shared.ready) ? Shared.coaches[n]?.team : store.get("elf.teams", {})[n])
                    || COACHES.find(c => c.name === n)?.team || n;
const sharedReady = new Promise(res => { if (Shared.ready) res(); else { Shared.on(() => res()); setTimeout(res, 4000); } });

/* ───────── state ───────── */
let people = [], games = [], round = null, box = {}, timer = null, busy = false;
let order = [...COACHES.map(c => c.name), WATCH];   // carousel order (most → least PIR, set once data loads; watch team always last)
let cur = COACHES.some(c => c.name === qs.get("coach")) || qs.get("coach") === WATCH ? qs.get("coach") : COACHES[0].name;
let built = false, sel = null, target = null, drag = null, suppressClick = false;
const $ = s => document.querySelector(s);
const r1 = v => Math.round(v * 100) / 100;          // values are kept to 2 decimals; only display rounds further
const fmtShort = v => r1(v).toFixed(1);               // cards, lists, totals: 14.3
const fmtFull  = v => r1(v).toFixed(2);               // detail views: 14.30
// team-result adjustment: ±10% of the absolute PIR, so negatives move the right way (−5 → −4.5 on a win, −5.5 on a loss)
const adjustPir = (raw, win) => r1(raw + (win ? 1 : -1) * Math.abs(raw) * 0.1);
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const track = $("#track");

/* wild cards */
const chipsOf = n => (round != null && chipsAll[n]?.[round]) || {};
function setChip(n, k, on){
  const all = chipsAll[n] = chipsAll[n] || {};
  const c = all[round] = all[round] || {};
  if (on) c[k] = true; else delete c[k];
  if (!Object.keys(c).length) delete all[round];
  store.set(wkey(n), all);
  Shared.push(n, {chips: clone(all)});
}
/* share of a player's PIR: group (100/50/0 — Bench Boost lifts 50% to 100%) × captain (2×, Triple Captain 3×) */
function shareOf(n, p){
  if (n === WATCH) return 1;                   // watch team: just the player's PIR (±10% once final)
  const wc = chipsOf(n);
  const group = p.slot === "full" ? 1 : p.slot === "half" ? (wc.bb ? 1 : 0.5) : 0;
  const capt = p.captain && p.slot === "full" ? (wc.tc ? 3 : 2) : 1;
  return group * capt;
}

function niceName(raw){            // "WALKER IV, LONNIE" → "Lonnie Walker IV"
  const [last, first = ""] = raw.split(/,\s*/);
  const tc = s => s.toLowerCase().split(/([\s.'-])/).map(w => /^(ii|iii|iv)$/.test(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1)).join("");
  return (tc(first) + " " + tc(last)).trim();
}
async function getJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error(r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;      // live endpoints return "" before tip-off
}
async function cached(key, ttl, loader){
  const c = store.get(key);
  if (c && Date.now() - c.t < ttl) return c.v;
  try{ const v = await loader(); store.set(key, {t:Date.now(), v}); return v; }
  catch(e){ if (c) return c.v; throw e; }
}

/* ───────── API ───────── */
const loadPeople = () => cached(`elf.people.${SEASON}`, 12 * 3600e3, async () => {
  const d = (await getJSON(`${V2}/people?personType=J`)).data;
  const m = new Map();
  d.filter(x => x.active).forEach(x => m.set(x.person.code, {
    code: x.person.code, name: niceName(x.person.name),
    club: x.club.code, tv: x.club.tvCode || x.club.code, clubName: x.club.editorialName || x.club.name,
    crest: x.club.images?.crest || "", img: x.images?.headshot || "",
    pos: (x.positionName || "–").charAt(0)
  }));
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name));
});

const loadGames = () => cached(`elf.games.${SEASON}`, 10 * 60e3, async () => {
  const d = (await getJSON(`${V2}/games`)).data;
  const side = s => ({c:s.club.code, tv:s.club.tvCode || s.club.code});
  return d.map(x => ({c:x.gameCode, r:x.round, u:x.utcDate, p:x.played, h:side(x.local), a:side(x.road)}));
});

async function loadBox(g){
  const key = `elf.box.${SEASON}.${g.c}`;
  const c = store.get(key);
  if (c && c.final && !DEMO) return c;                       // finished games never change
  const d = await getJSON(`${LIVE_API}/Boxscore?gamecode=${g.c}&seasoncode=${SEASON}`);
  if (!d || !d.Stats || d.Stats.length < 2) return {pending:true};
  const teams = d.Stats.map(s => {                           // Stats[0] = home, Stats[1] = away
    const pl = {};
    s.PlayersStats.forEach(p => pl[p.Player_ID.replace(/^P/, "").trim()] = {pir:p.Valuation, min:p.Minutes, on:!!p.IsPlaying});
    return {pts: +(s.totr?.Points || 0), pl};
  });
  const tot = teams[0].pts + teams[1].pts;
  const b = {live: !!d.Live, final: !d.Live && tot > 0, pending: !d.Live && tot === 0, teams};
  if (DEMO){ Object.assign(b, {live:true, final:false, pending:false, q:"4", t:"03:21"}); }
  else if (b.live){
    try{ const h = await getJSON(`${LIVE_API}/Header?gamecode=${g.c}&seasoncode=${SEASON}`); b.q = h?.Quarter; b.t = h?.RemainingPartialTime; }catch{}
  }
  if (b.final) store.set(key, b);
  return b;
}

/* ───────── fantasy logic ─────────
   PIR = raw PIR while live; once final ±10% for the team's win/loss.
   Then the share applies (group %, captain multiplier, wild cards). */
function stateOf(p, n){
  const g = games.find(g => g.r === round && (g.h.c === p.club || g.a.c === p.club));
  if (!g) return {kind:"none"};
  const home = g.h.c === p.club, opp = home ? g.a : g.h;
  const started = DEMO || new Date(g.u) <= new Date();
  const b = box[g.c];
  if (!started) return {kind:"up", g, opp, home};
  if (!b || b.pending) return {kind:"soon", g, opp, home};
  const ti = b.teams[0].pl[p.code] ? 0 : b.teams[1].pl[p.code] ? 1 : (home ? 0 : 1);
  const me = b.teams[ti], them = b.teams[1 - ti], st = me.pl[p.code];
  const dnp = !st || /dnp/i.test(st.min || "");
  const raw = st && !dnp ? st.pir : 0;
  const win = me.pts > them.pts;
  const live = b.live;
  const base = live ? raw : adjustPir(raw, win);
  const share = shareOf(n, p);
  return {kind: live ? "live" : "final", g, opp, home, raw, dnp, win, base, share,
          val: r1(base * share),
          shown: p.slot === "zero" ? r1(base) : r1(base * share),   // 0% group shows full PIR (display only, never counted)
          score: `${me.pts}–${them.pts}`, lead: Math.sign(me.pts - them.pts), on: live && !!st?.on, q: b.q, t: b.t};
}
function coachTotal(n){
  let total = 0, live = false;
  if (games.length) rosters[n].forEach(p => { const s = stateOf(p, n); if (s.kind === "live" || s.kind === "final"){ total += s.val; live ||= s.kind === "live" && s.share > 0; } });
  return {total: r1(total), live};
}

/* ───────── rendering ───────── */
const when = u => new Date(u).toLocaleString([], {weekday:"short", hour:"2-digit", minute:"2-digit"});
const photo = p => `<div class="ph">${esc(p.name.split(" ").map(w => w[0]).slice(0, 2).join(""))}${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;
function liveClock(s){
  const q = String(s.q || "").replace(/\D/g, "");
  const qtxt = q ? (+q > 4 ? "OT" : "Q" + q) : "LIVE";
  return `<span class="lchip"><i></i>${qtxt}${s.t && s.t !== "00:00" ? " " + esc(s.t.replace(/^0/, "")) : ""}</span>`;
}
function subline(p, s){
  const tv = `<span class="tv">${esc(p.tv)}</span>`;
  switch (s.kind){
    case "live":  return `${tv} ${liveClock(s)} <span class="score ${s.lead > 0 ? "ahead" : s.lead < 0 ? "behind" : ""}">${s.score}</span>`;
    case "final": return s.dnp ? `${tv} <span class="res D">DNP</span>` :
                  `${tv} <span class="score fin ${s.win ? "ahead" : "behind"}">${s.score}</span>`;
    case "soon":  return `${tv} · ${s.home ? "vs" : "@"} ${esc(s.opp.tv)} · starting`;
    case "up":    return `${tv} · ${s.home ? "vs" : "@"} ${esc(s.opp.tv)} · ${when(s.g.u)}`;
    default:      return `${tv} · no game this round`;
  }
}
function rowHTML({p, i, s}, n){
  const has = s.kind === "live" || s.kind === "final";
  const wc = chipsOf(n);
  const isCapt = p.captain && p.slot === "full";
  const capt = isCapt ? `<span class="capt${wc.tc ? " tc" : ""}">C</span>` : "";
  const boosted = (wc.tc && isCapt) || (wc.bb && p.slot === "half");   // Triple Captain / Bench Boost players
  return `<div class="p ${s.kind}${boosted ? " wc-card" : ""}" data-i="${i}">
    <div class="phw">${photo(p)}${capt}${s.on ? '<i class="oc" title="On court"></i>' : ""}</div>
    <div class="who"><b>${esc(p.name)}</b><small>${subline(p, s)}</small></div>
    <div class="val${has && p.slot === "zero" ? " struck" : ""}">${has ? fmtShort(s.shown) : "–"}</div>
  </div>`;
}
const emptyHTML = slot => `<div class="p empty" data-add="${slot}"><div class="phw"><div class="ph">+</div></div><div class="who"><b>Empty slot</b></div></div>`;
const sortKey = r => r.s.kind === "live" ? [0, -r.s.shown] : r.s.kind === "final" ? [1, -r.s.shown]      // by the PIR shown
                   : r.s.kind === "soon" ? [2, 0] : r.s.kind === "up" ? [3, +new Date(r.s.g.u)] : [4, 0];
const hasPir = r => r.s.kind === "live" || r.s.kind === "final";
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
// players with PIR: sorted by PIR, on top (captain first only on a tie) · players without PIR yet: manual order
const byKey = (a, b) => {
  const pa = hasPir(a), pb = hasPir(b);
  if (pa !== pb) return pa ? -1 : 1;
  if (pa){ const x = sortKey(a), y = sortKey(b); return x[0] - y[0] || x[1] - y[1] || (b.p.captain ? 1 : 0) - (a.p.captain ? 1 : 0); }
  return byOrder(a.p, b.p);
};
const endOrder = (n, slots) => Math.max(0, ...rosters[n].filter(p => slots.includes(p.slot)).map(p => p.order ?? 0)) + 10;
const zoneSlots = (n, key) => key === "full" && chipsOf(n).bb ? ["full", "half"] : [key];   // Bench Boost shows 100% + 50% as one block
const slideOf = n => track.querySelector(`.slide[data-coach="${CSS.escape(n)}"]`);
const WC_NAMES = {tc:"Triple Captain", bb:"Bench Boost"};

function buildSlides(){
  track.innerHTML = order.map(n => `
    <section class="slide" data-coach="${esc(n)}"><div class="page">
      <div class="list"></div>

}
function renderSlide(n){

      ${rows.sort(byKey).map(r => rowHTML(r, n)).join("")}
      ${rosters[WATCH].length < WATCH_MAX ? `<div class="p empty" data-add="watch"><div class="phw"><div class="ph">+</div></div><div class="who"><b>Add player</b><small>${rosters[WATCH].length}/${WATCH_MAX} · not counted in the standings</small></div></div>` : ""}

    return `<div class="zone z-${gr.key}" data-zone="${gr.key}">

/* ───────── carousel ───────── */

sizeHeader(); addEventListener("resize", sizeHeader);

/* ───────── refresh loop ───────── */
const allPlayers = () => COACHES.flatMap(c => rosters[c.name]);
function relevantGames(){
  const clubs = new Set([...allPlayers(), ...rosters[WATCH]].map(p => p.club));
  return games.filter(g => g.r === round && (clubs.has(g.h.c) || clubs.has(g.a.c)));
}
async function refresh(){
  if (busy || !games.length) return;
  busy = true;
  try{
    const need = relevantGames().filter(g => DEMO || new Date(g.u) <= new Date());
    const res = await Promise.all(need.map(g => loadBox(g).then(b => [g.c, b]).catch(() => [g.c, box[g.c]])));
    res.forEach(([c, b]) => { if (b) box[c] = b; });
    $("#banner").classList.remove("show");
  }catch{ $("#banner").classList.add("show"); }
  busy = false;
  if (!built){       // first load: order coaches by this round's PIR, most → least
    order = [...COACHES.map((c, k) => ({n:c.name, k, t:coachTotal(c.name).total})).sort((a, b) => b.t - a.t || a.k - b.k).map(x => x.n), WATCH];
    buildSlides();
  } else render();
  if (actWrap.classList.contains("open") && selected()){ fillSheet(false); if (shTab === "game" || shTab === "mins" || shTab === "team") renderTab(); }
  schedule();
}
function schedule(){
  clearTimeout(timer);
  if (document.hidden) return;
  const rel = relevantGames();
  const now = Date.now();
  const inPlay = rel.some(g => (DEMO || new Date(g.u) <= now) && !(box[g.c] && box[g.c].final));
  let wait = IDLE_POLL;
  if (inPlay) wait = LIVE_POLL;
  else {
    const next = rel.map(g => +new Date(g.u)).filter(t => t > now).sort((a, b) => a - b)[0];
    if (next) wait = Math.min(IDLE_POLL, Math.max(10_000, next - now + 5_000));
  }
  timer = setTimeout(refresh, wait);
}
document.addEventListener("visibilitychange", () => document.hidden ? clearTimeout(timer) : refresh());

function currentRound(){         // the league's round (shared, moves on when "Start Round X" is pressed); else latest that has tipped off
  if (!DEMO && Shared.league?.round) return Shared.league.round;
  const now = new Date();
  if (DEMO){                     // demo replays the latest round where every game is finished
    const full = [...new Set(games.map(g => g.r))].filter(r => games.filter(g => g.r === r).every(g => g.p));
    if (full.length) return Math.max(...full);
  }
  const started = games.filter(g => new Date(g.u) <= now);
  return started.length ? Math.max(...started.map(g => g.r)) : Math.min(...games.map(g => g.r));
}

async function boot(){
  renderHeader();
  try{
    Shared.start();
    [people, games] = await Promise.all([loadPeople(), loadGames(), sharedReady]);
    round = currentRound();
    if (DEMO) seedDemo();
    $("#banner").classList.remove("show");
  }catch{
    $("#banner").classList.add("show");
    if (!built) buildSlides();
    return;
  }
  refresh();
}
function seedDemo(){         // demo: give every empty coach a different set of players from this round
  const clubs = games.filter(g => g.r === round).flatMap(g => [g.h.c, g.a.c]);
  const used = new Set(allPlayers().map(p => p.code));
  COACHES.forEach(({name}, k) => {
    if (rosters[name].length) return;
    let n = 0;
    clubs.forEach((c, j) => {
      if (n >= MAX || (j + k) % 2) return;                      // vary clubs between coaches
      const p = people.find(x => x.club === c && x.img && !used.has(x.code));
      if (p){ used.add(p.code); rosters[name].push({...p, slot: freeSlot(name)}); n++; }
    });
    if (rosters[name][0]) rosters[name][0].captain = true;
    save(name);
  });
}

/* ───────── interactions ───────── */
$("#retry").onclick = boot;
const actWrap = $("#actWrap"), wcWrap = $("#wcWrap"), finder = $("#finder");
document.querySelectorAll("[data-close]").forEach(s => s.onclick = () => { actWrap.classList.remove("open"); wcWrap.classList.remove("open"); });
/* every sheet: press the grab area (or header) and drag down to close; a short drag springs back */
document.querySelectorAll(".sheet").forEach(sh => {
  let y0 = 0, dy = 0, t0 = 0, id = null;
  const move = y => { dy = Math.max(0, y - y0); sh.style.transform = `translate(-50%, ${dy}px)`; };
  const end = () => {
    if (id == null) return;
    id = null; sh.classList.remove("dragging");
    const fast = dy > 30 && dy / Math.max(1, Date.now() - t0) > 0.5;          // a quick flick also closes
    sh.style.transform = "";
    if (dy > Math.min(120, sh.offsetHeight * 0.3) || fast) sh.parentElement.classList.remove("open");
  };
  sh.querySelectorAll(".grab, .sh-head").forEach(h => {
    h.addEventListener("pointerdown", e => {
      id = e.pointerId; y0 = e.clientY; dy = 0; t0 = Date.now();
      sh.classList.add("dragging"); h.setPointerCapture(id);
    });
    h.addEventListener("pointermove", e => { if (e.pointerId === id) move(e.clientY); });
    h.addEventListener("pointerup", end);
    h.addEventListener("pointercancel", end);
  });
});

/* ───────── player sheet ───────── */
let shTab = "game", tabSeq = 0;
function fillSheet(first){

             : s.kind === "live" ? `live ${fmtFull(s.raw)} × ${s.share}` : "";

      const h = img.naturalWidth ? Math.min(pic.offsetHeight, pic.offsetWidth * img.naturalHeight / img.naturalWidth) : pic.offsetHeight;
      img.style.setProperty("--gap", (g * h).toFixed(1) + "px");

$("#shTabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  shTab = b.dataset.tab; renderTab();
});
const pct = (m, a) => a ? Math.round(m / a * 100) + "%" : "–";
const sign = v => v > 0 ? "+" + v : String(v);
const clockOf = (m, len) => {                           // game minute → "Q2 07:00" / "OT1 03:00"
  const ot = m >= 40 && len > 40 ? Math.min(Math.floor((m - 40) / 5), (len - 40) / 5 - 1) : -1;
  const q = ot >= 0 ? "OT" + (ot + 1) : "Q" + Math.min(4, Math.floor(m / 10) + 1);
  const end = ot >= 0 ? 45 + ot * 5 : Math.min(4, Math.floor(m / 10) + 1) * 10;
  const left = Math.max(0, end - m), sec = Math.round(left * 60);
  return `${q} ${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
};
const mmss = m => { const sec = Math.round(m * 60); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; };
function gameOf(p){ return games.find(g => g.r === round && (g.h.c === p.club || g.a.c === p.club)); }

async function renderTab(){
  const p = selected(); if (!p) return;
  const seq = ++tabSeq, pane = $("#shPane");
  document.querySelectorAll("#shTabs [data-tab]").forEach(b => { b.classList.toggle("on", b.dataset.tab === shTab); b.setAttribute("aria-selected", b.dataset.tab === shTab); });
  $("#shEdit").hidden = shTab !== "edit";
  pane.hidden = shTab === "edit";
  if (shTab === "edit") return;
  const stale = () => seq !== tabSeq || !actWrap.classList.contains("open");
  if (!pane.dataset.tab || pane.dataset.tab !== shTab + p.code) paneSet(pane, `<div class="loading">Loading…</div>`);
  pane.dataset.tab = shTab + p.code;
  try{
    const html = shTab === "game" ? await gamePane(p) : shTab === "mins" ? await minsPane(p) : shTab === "team" ? await teamPane(p) : await seasonPane(p, h => { if (!stale()) paneSet(pane, h); });
    if (!stale()) paneSet(pane, html);
  }catch{ if (!stale()) paneSet(pane, `<div class="empty">Couldn't load this right now. Try again in a moment.</div>`); }
}

/* live updates redraw the tab: skip it when nothing changed, and keep where you've scrolled (the sheet and the sideways table) */
function paneSet(pane, html){
  if (pane._html === html) return;
  const body = actWrap.querySelector(".sh-body"), y = body.scrollTop, x = pane.querySelector(".tmw")?.scrollLeft || 0;
  pane.innerHTML = pane._html = html;
  const w = pane.querySelector(".tmw"); if (w) w.scrollLeft = x;
  body.scrollTop = y;
}
function gameHead(g, b, p){
  const h = g.h, a = g.a;
  if (!b || b.pending) return `<div class="gm"><span class="tm">${esc(h.tv)}</span><span class="sc">vs<small>${new Date(g.u) > new Date() ? esc(when(g.u)) : "STARTING"}</small></span><span class="tm r">${esc(a.tv)}</span></div>`;
  const s = stateOf(p, sel.n);
  const status = b.live ? `<small class="lv">${liveClock(s).replace(/<[^>]+>/g, "") || "LIVE"}</small>` : `<small>FINAL</small>`;
  return `<div class="gm"><span class="tm">${esc(h.tv)}</span><span class="sc">${b.teams[0].pts} – ${b.teams[1].pts}${status}</span><span class="tm r">${esc(a.tv)}</span></div>`;
}
async function gamePane(p){
  const g = gameOf(p);
  if (!g) return `<div class="empty">No game this round.</div>`;
  if (new Date(g.u) > new Date()) return gameHead(g, null, p) + `<div class="empty">Stats show up once the game starts.</div>`;
  const b = await ElData.box(g.c);
  const l = await ElData.line(g.c, p.code);
  if (b.pending) return gameHead(g, b, p) + `<div class="empty">Waiting for the first stats…</div>`;
  if (!l || l.min === "DNP" || !l.mins) return gameHead(g, b, p) + `<div class="empty">Did not play${b.live ? " yet" : ""}.</div>`;
  const pf = Math.min(5, l.pf || 0);
  const cell = (v, lab, extra = "", cls = "") => `<div class="${cls}"><b>${v}</b><small>${lab}</small>${extra}</div>`;
  return gameHead(g, b, p) + `<div class="grid">
    ${cell(esc(l.min), "MIN", l.on && b.live ? `<em style="color:var(--win)">on court</em>` : l.starter ? `<em>starter</em>` : "")}
    ${cell(l.pts, "PTS")}${cell(l.tr, "REB", `<em>${l.or} off · ${l.dr} def</em>`)}${cell(l.ast, "AST")}
    ${cell(`${l.fg2m}/${l.fg2a}`, "2PT", `<em>${pct(l.fg2m, l.fg2a)}</em>`)}${cell(`${l.fg3m}/${l.fg3a}`, "3PT", `<em>${pct(l.fg3m, l.fg3a)}</em>`)}
    ${cell(`${l.ftm}/${l.fta}`, "FT", `<em>${pct(l.ftm, l.fta)}</em>`)}${cell(sign(l.pm), "+/−")}
    ${cell(l.stl, "STL")}${cell(l.to, "TO")}${cell(l.blk, "BLK", `<em>${l.blka} against</em>`)}${cell(l.fd, "DRAWN", `<em>fouls on him</em>`)}
    <div class="wide"><b>${l.pf}</b><small>FOULS</small><div class="fouls${pf >= 4 ? " warn" : ""}">${[1,2,3,4,5].map(i => `<i class="${i <= pf ? "on" : ""}"></i>`).join("")}</div></div>
    ${cell(fmtFull(l.pir), "PIR", "", "wide")}
  </div>`;
}
async function minsPane(p){
  const g = gameOf(p);
  if (!g) return `<div class="empty">No game this round.</div>`;
  if (new Date(g.u) > new Date()) return `<div class="empty">Minutes show up once the game starts.</div>`;
  const [st, l] = await Promise.all([ElData.stretches(g.c), ElData.line(g.c, p.code)]);
  if (st.pending) return `<div class="empty">Waiting for the first plays…</div>`;
  const mine = st.pl[p.code] || [], len = st.len, x = m => (m / len * 100).toFixed(2) + "%";
  const total = mine.reduce((a, [f, t]) => a + t - f, 0);
  const marks = []; for (let m = 10; m < len; m += m < 40 ? 10 : 5) marks.push(m);
  const labels = []; for (let q = 0; q < 4; q++) labels.push([q * 10 + 5, "Q" + (q + 1)]);
  for (let o = 0; 40 + o * 5 < len; o++) labels.push([42.5 + o * 5, "OT" + (o + 1)]);
  const bar = `<div class="tl">
      ${mine.map(([f, t]) => `<div class="seg" style="left:${x(f)};width:calc(${x(t - f)} - 1px)"></div>`).join("")}
      ${marks.map(m => `<div class="q" style="left:${x(m)}"></div>`).join("")}
      ${st.live ? `<div class="fut" style="left:${x(st.now)}"></div><div class="now" style="left:${x(st.now)}"></div>` : ""}
    </div><div class="tl-lab">${labels.map(([m, t]) => `<span style="left:${x(m)}">${t}</span>`).join("")}</div>`;
  if (!mine.length) return bar + `<div class="empty">Hasn't been on court${st.live ? " yet" : ""}.</div>`;
  const onNow = st.live && mine.length && Math.abs(mine[mine.length - 1][1] - st.now) < 0.01;
  return `<div class="mins-sum"><b>${l?.min && l.min !== "DNP" ? esc(l.min) : mmss(total)}</b><small>${mine.length} stint${mine.length > 1 ? "s" : ""}${l?.starter ? " · starter" : ""}${onNow ? ` · <span style="color:var(--win)">on court now</span>` : ""}</small></div>`
    + bar + mine.map(([f, t], i) => `<div class="stint">${clockOf(f, len)} → ${onNow && i === mine.length - 1 ? "now" : clockOf(t, len)}<span>${mmss(t - f)}</span></div>`).join("");
}

/* Team tab: everyone on his team in this round's game */
let tmSort = {k: "pir", dir: -1};
const TM_COLS = [["min", "MIN"], ["pts", "PTS"], ["fg2", "2FG"], ["fg3", "3FG"], ["ft", "FT"], ["tr", "REB"], ["ast", "AST"], ["stl", "STL"],
                 ["to", "TO"], ["blk", "BLK"], ["pf", "PF"], ["pm", "+/−"], ["pir", "PIR"]];
async function teamPane(p){
  const g = gameOf(p);
  if (!g) return `<div class="empty">No game this round.</div>`;
  if (new Date(g.u) > new Date()) return `<div class="empty">The team's stats show up once the game starts.</div>`;
  const b = await ElData.box(g.c);
  if (b.pending) return `<div class="empty">Waiting for the first stats…</div>`;
  const t = b.teams.find(t => t.pl[p.code]) || b.teams[g.h.c === p.club ? 0 : 1];
  const fantasy = new Set(allPlayers().map(x => x.code));
  const val = (l, k) => k === "min" ? l.mins : k === "fg2" ? l.fg2m : k === "fg3" ? l.fg3m : k === "ft" ? l.ftm : l[k];
  const rows = Object.entries(t.pl).map(([code, l]) => ({code, l, dnp: l.min === "DNP" || !l.mins}));
  rows.sort((a, c) => (a.dnp - c.dnp) || tmSort.dir * (val(a.l, tmSort.k) - val(c.l, tmSort.k)) || c.l.mins - a.l.mins);
  const cell = (l, k) => k === "min" ? esc(l.min) : k === "fg2" ? `${l.fg2m}/${l.fg2a}` : k === "fg3" ? `${l.fg3m}/${l.fg3a}` : k === "ft" ? `${l.ftm}/${l.fta}` : k === "pm" ? sign(l.pm) : l[k];
  return `<div class="tmw"><table class="tmt"><thead><tr><th data-sort="name">${esc(t.name ? t.name.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()) : t.code)}</th>
      ${TM_COLS.map(([k, lab]) => `<th data-sort="${k}" class="${tmSort.k === k ? "on" + (tmSort.dir > 0 ? " asc" : "") : ""}">${lab}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(({code, l, dnp}) => `<tr class="${code === p.code ? "me" : ""}${dnp ? " dnp" : ""}">
        <td><span>${esc(l.no)}</span>${esc(shortName(l.name))}${fantasy.has(code) && code !== p.code ? '<i class="fan" title="On a fantasy roster"></i>' : ""}</td>
        ${dnp ? `<td colspan="${TM_COLS.length}" style="text-align:left">DNP</td>` : TM_COLS.map(([k]) => `<td class="${k}">${cell(l, k)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>
    <div class="tm-note">Tap a column to sort. <i class="fan"></i> on someone's fantasy roster.</div>`;
}
const shortName = n => { const w = String(n || "").split(" "); return w.length > 1 ? `${w[0][0]}. ${w.slice(1).join(" ")}` : n; };
$("#shPane").addEventListener("click", e => {
  const th = e.target.closest(".tmt th[data-sort]"); if (!th || th.dataset.sort === "name") return;
  const k = th.dataset.sort;
  tmSort = tmSort.k === k ? {k, dir: -tmSort.dir} : {k, dir: -1};
  renderTab();
});
async function seasonPane(p, partial){
  const draw = rows => {
    const done = rows.filter(r => !r.loading && r.pir != null);
    const played = done.filter(r => r.played);
    const avg = k => played.length ? (played.reduce((a, r) => a + r[k], 0) / played.length) : 0;
    const best = played.length ? Math.max(...played.map(r => r.pir)) : null;
    const max = Math.max(5, ...done.map(r => Math.abs(r.pir || 0)));
    const neg = done.some(r => r.pir < 0), zero = neg ? 60 : 100;                   // baseline position (% from top)
    const chart = rows.length ? `<div class="chart">${rows.map(r => {
      if (r.loading || r.pir == null) return `<div class="col"><div class="bar dnp" style="bottom:${100 - zero}%;height:2px"></div></div>`;
      const h = Math.abs(r.pir) / max * (neg ? 58 : 98);
      return `<div class="col" title="R${r.r}: ${r.pir}">${r.pir >= 0 ? `<div class="bar" style="bottom:${100 - zero}%;height:${h}%"></div>` : `<div class="bar neg" style="top:${zero}%;height:${h}%"></div>`}</div>`;
    }).join("")}<div class="zero" style="top:${zero}%"></div></div>` : "";
    const res = r => r.pending || r.pts == null ? "–" : `<span class="${r.live ? "" : r.win ? "w" : "l"}">${r.live ? "LIVE" : r.win ? "W" : "L"}</span> ${r.pts}–${r.oppPts}`;
    return `<div class="avg">
        <div><b>${played.length}</b><small>GAMES</small></div>
        <div><b>${played.length ? avg("pir").toFixed(1) : "–"}</b><small>AVG PIR</small></div>
        <div><b>${played.length ? mmss(avg("mins")) : "–"}</b><small>AVG MIN</small></div>
        <div><b>${best ?? "–"}</b><small>BEST</small></div>
      </div>${chart}
      <table class="hist"><thead><tr><th>RD</th><th>OPP</th><th>RESULT</th><th>MIN</th><th>PIR</th><th>±10%</th></tr></thead><tbody>
      ${rows.slice().reverse().map(r => `<tr class="${r.r === round ? "cur" : ""}"><td class="rd">${r.r}</td><td>${r.home ? "vs" : "@"} ${esc(r.opp.tv)}</td>
        <td>${r.loading ? "…" : res(r)}</td><td>${r.loading ? "" : r.played ? esc(r.min) : r.pending ? "–" : "DNP"}</td>
        <td><b>${r.loading || r.pir == null ? "" : r.pir}</b></td><td>${r.loading || r.adj == null ? "" : fmtFull(r.adj)}</td></tr>`).join("")}
      </tbody></table>
      <div class="hist-note">Games for ${esc(p.clubName || p.tv)} this season. PIR is raw; ±10% adds the team result like the fantasy score.</div>`;
  };
  let pending = null;
  const rows = await ElData.history(p.code, p.club, games, rs => {        // fill in rows as games arrive (at most ~5 redraws a second)
    if (pending) return; pending = setTimeout(() => { pending = null; partial(draw(rs)); }, 200);
  });
  clearTimeout(pending);
  return rows.length ? draw(rows) : `<div class="empty">No games played yet this season.</div>`;
}

/* share of a photo's height that is empty (transparent) below the player — measured once, remembered on this phone */
const gaps = store.get("elf.photoGap", {});
function photoGap(url){
  if (url in gaps) return Promise.resolve(gaps[url]);
  return new Promise(res => {
    const im = new Image();
    im.crossOrigin = "anonymous";                      // separate request (?g=1) so the normal cached photo is never affected
    im.onload = () => {
      try{
        const w = 60, h = Math.round(60 * im.naturalHeight / im.naturalWidth) || 80;   // a small copy is plenty
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const x = c.getContext("2d"); x.drawImage(im, 0, 0, w, h);
        const d = x.getImageData(0, 0, w, h).data;
        let last = h - 1;
        rows: for (; last > 0; last--) for (let i = 0; i < w; i++) if (d[(last * w + i) * 4 + 3] > 24) break rows;
        gaps[url] = Math.round((h - 1 - last) / h * 1000) / 1000; store.set("elf.photoGap", gaps);
      }catch{ gaps[url] = 0; }                         // couldn't read it: leave the photo as is
      res(gaps[url]);
    };
    im.onerror = () => res(0);
    im.src = url + (url.includes("?") ? "&" : "?") + "g=1";
  });
}
function selected(){ return sel && rosters[sel.n]?.find(x => x.code === sel.code); }
$("#captBtn").onclick = () => {
  const list = rosters[sel.n], p = selected();
  if (!p){ actWrap.classList.remove("open"); return; }
  const make = !p.captain;
  list.forEach(x => delete x.captain);
  if (make) p.captain = true;
  save(sel.n); actWrap.classList.remove("open"); renderSlide(sel.n); renderHeader();
  toast(make ? `${p.name} is captain` : "Captain removed");
};
$("#removeBtn").onclick = () => { const i = rosters[sel.n].findIndex(x => x.code === sel.code); if (i < 0){ actWrap.classList.remove("open"); return; } const [p] = rosters[sel.n].splice(i, 1); save(sel.n); actWrap.classList.remove("open"); renderSlide(sel.n); renderHeader(); toast(`${p.name} removed`); };

/* wild cards */
function renderWc(){
  const wc = chipsOf(cur);
  $("#wcSub").textContent = `${teamOf(cur)} · Round ${round ?? "–"}`;
  wcWrap.querySelectorAll("[data-wc]").forEach(b => b.classList.toggle("on", !!wc[b.dataset.wc]));
}
$("#wcBtn").onclick = () => { if (round == null) return; renderWc(); wcWrap.classList.add("open"); };
wcWrap.addEventListener("click", e => {
  const b = e.target.closest("[data-wc]"); if (!b) return;
  const k = b.dataset.wc, on = !chipsOf(cur)[k];
  setChip(cur, k, on);
  renderWc(); renderSlide(cur); renderHeader();
  if (on && k === "tc" && !rosters[cur].some(p => p.captain)) toast("Pick a captain in the 100% group for Triple Captain to count");
});

/* full-screen add player */
$("#closeFinder").onclick = closeFinder;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeFinder(); });
function openFinder(n, slot){
  if (n === WATCH && rosters[WATCH].length >= WATCH_MAX){ toast(`Watch team is full (${WATCH_MAX})`); return; }
  if (!slot){ toast("Roster is full (13/13)"); return; }
  target = {n, slot};
  finder.classList.add("open");
  renderResults();
  setTimeout(() => $("#q").focus(), 260);
}
function closeFinder(){
  finder.classList.remove("open");
  $("#q").blur();
}
$("#q").addEventListener("input", renderResults);
function renderResults(){
  if (!target) return;
  const {n, slot} = target;
  const open = SLOTS[slot] - slotCount(n, slot);
  $("#slots").innerHTML = n === WATCH ? `<b>Watch team</b> · only on this phone · ${rosters[WATCH].length}/${WATCH_MAX} · tap again to remove`
    : `${esc(teamOf(n))} · adding to <b>${LABEL[slot]}</b> · ${open} open slot${open === 1 ? "" : "s"} · ${rosters[n].length}/13`;
  const q = norm($("#q").value.trim());
  const out = $("#results");
  if (!people.length){ out.innerHTML = `<div class="r-hint">Loading Euroleague players…</div>`; return; }
  if (q.length < 2){ out.innerHTML = `<div class="r-hint">Type a player name or team.<br>${people.length} players in the ${SEASON.slice(1)}–${(+SEASON.slice(3) + 1) % 100} season.</div>`; return; }
  const hits = people.filter(p => norm(p.name).includes(q) || norm(p.clubName).includes(q) || norm(p.tv) === q || norm(p.club) === q).slice(0, 60);
  const owner = {};
  COACHES.forEach(c => rosters[c.name].forEach(p => owner[p.code] = c.name));
  const watched = new Set(rosters[WATCH].map(p => p.code));
  out.innerHTML = hits.map(p => {
    if (n === WATCH){                           // any player can be watched, including ones on fantasy rosters
      const o = owner[p.code], on = watched.has(p.code);
      return `<div class="r" data-code="${p.code}">
        ${photo(p)}
        <div class="who"><b>${esc(p.name)}</b><small>${p.crest ? `<img class="crest" src="${esc(p.crest)}" alt="">` : ""}<span class="tv">${esc(p.tv)}</span> ${esc(p.clubName)} · ${esc(p.pos)}${o ? ` · ${esc(teamOf(o))}` : ""}</small></div>
        <button class="add${on ? " on" : ""}" aria-label="${on ? "Remove" : "Add"}">${on ? "✓" : "+"}</button>
      </div>`;
    }
    const o = owner[p.code], mine = o === n;
    return `<div class="r ${o ? "taken" : ""}" data-code="${p.code}">
      ${photo(p)}
      <div class="who"><b>${esc(p.name)}</b><small>${p.crest ? `<img class="crest" src="${esc(p.crest)}" alt="">` : ""}<span class="tv">${esc(p.tv)}</span> ${esc(p.clubName)} · ${esc(p.pos)}</small></div>
      ${o && !mine ? `<span class="owner">${esc(teamOf(o))}</span>` : `<button class="add" aria-label="Add">${mine ? "✓" : "+"}</button>`}
    </div>`;
  }).join("") || `<div class="r-hint">No players match “${esc($("#q").value)}”.</div>`;
}
$("#results").addEventListener("click", e => {
  const r = e.target.closest(".r"); if (!r || r.classList.contains("taken")) return;
  const n = target.n;
  if (n === WATCH){                             // watch team: tap to add, tap again to remove
    const list = rosters[WATCH], k = list.findIndex(x => x.code === r.dataset.code);
    if (k >= 0){ const [p] = list.splice(k, 1); toast(`${p.name} removed`); }
    else {
      if (list.length >= WATCH_MAX){ toast(`Watch team is full (${WATCH_MAX})`); return; }
      const p = people.find(x => x.code === r.dataset.code);
      list.push({...p, slot: "watch", order: Math.max(0, ...list.map(x => x.order ?? 0)) + 10});
      toast(`${p.name} → Watch team`);
    }
    save(WATCH); renderSlide(WATCH); renderHeader(); refresh(); renderResults();
    return;
  }
  if (slotCount(n, target.slot) >= SLOTS[target.slot]) target.slot = freeSlot(n);
  if (!target.slot){ toast("Roster is full (13/13)"); closeFinder(); return; }
  const p = people.find(x => x.code === r.dataset.code);
  rosters[n].push({...p, slot: target.slot, order: endOrder(n, [target.slot])}); save(n);
  toast(`${p.name} → ${LABEL[target.slot]}`);
  renderSlide(n); renderHeader(); refresh();
  if (slotCount(n, target.slot) >= SLOTS[target.slot]){ target.slot = freeSlot(n); if (!target.slot){ setTimeout(closeFinder, 500); return; } }
  renderResults();
});

function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }

/* ───────── drag & swap (within one coach) ─────────
   Touch: press and hold ~0.3s, then drag. Mouse: just drag.
   Drop on a player in another group → they swap groups.
   Drop on another group's heading / empty slot → move there if it has room. */
document.addEventListener("pointerdown", e => {
  const card = e.target.closest(".slide .p[data-i]");
  if (!card || e.button > 0) return;
  drag = {card, n: coachOf(card), slide: card.closest(".slide"), i:+card.dataset.i, x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, id:e.pointerId, type:e.pointerType, on:false};
  if (e.pointerType !== "mouse") drag.timer = setTimeout(() => drag && startDrag(), 300);
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.lx = e.clientX; drag.ly = e.clientY;
  if (!drag.on){
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8){
      if (drag.type === "mouse") startDrag();
      else { clearTimeout(drag.timer); drag = null; }        // finger moved first → it's a scroll or swipe
    }
    return;
  }
  moveDrag();
});
document.addEventListener("pointerup", e => { if (drag && e.pointerId === drag.id) endDrag(true); });
document.addEventListener("pointercancel", () => { if (drag) endDrag(false); });
document.addEventListener("touchmove", e => { if (drag && drag.on) e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", e => { if (drag) e.preventDefault(); });
document.addEventListener("click", e => { if (suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

function startDrag(){
  const d = drag; d.on = true;
  const r = d.card.getBoundingClientRect();
  d.dx = d.x - r.left; d.dy = d.y - r.top;
  d.ghost = d.card.cloneNode(true);
  d.ghost.classList.add("ghost");
  Object.assign(d.ghost.style, {width: r.width + "px", left: r.left + "px", top: r.top + "px"});
  document.body.appendChild(d.ghost);
  d.card.classList.add("lifted");
  document.body.classList.add("dragging");
  navigator.vibrate?.(12);
  moveDrag();
  (function scroll(){                                       // auto-scroll near screen edges
    if (!drag || !drag.on) return;
    const top = $("#top").getBoundingClientRect().bottom - 30, edge = 80, y = drag.ly;
    const v = y < top + edge ? -(top + edge - y) / 6 : y > innerHeight - edge ? (y - (innerHeight - edge)) / 6 : 0;
    if (v){ drag.slide.scrollBy(0, v); highlight(); }
    requestAnimationFrame(scroll);
  })();
}
function dropTarget(){
  const el = document.elementFromPoint(drag.lx, drag.ly);
  if (!el || el.closest(".slide") !== drag.slide) return null;
  return el.closest(".p[data-i]") || el.closest("[data-zone]");
}
function highlight(){
  document.querySelectorAll(".drop,.ins-before,.ins-after").forEach(n => n.classList.remove("drop", "ins-before", "ins-after"));
  const t = dropTarget();
  if (!t || t === drag.card) return (drag.target = null, drag.pos = null);
  drag.target = t; drag.pos = null;
  if (t.matches(".p[data-i]")){
    const src = rosters[drag.n][drag.i];
    const slots = zoneSlots(drag.n, t.closest("[data-zone]").dataset.zone);
    const sameGroup = slots.includes(src.slot);
    const room = slots.some(s => slotCount(drag.n, s) < SLOTS[s]);
    if (!sameGroup && !room){ t.classList.add("drop"); return; }          // full group → swap
    const r = t.getBoundingClientRect();
    drag.pos = drag.ly < r.top + r.height / 2 ? "before" : "after";        // insert above / below this card
    t.classList.add(drag.pos === "before" ? "ins-before" : "ins-after");
  } else t.classList.add("drop");
}
function moveDrag(){
  drag.ghost.style.left = drag.lx - drag.dx + "px";
  drag.ghost.style.top = drag.ly - drag.dy + "px";
  highlight();
}
function endDrag(commit){
  const d = drag; drag = null;
  clearTimeout(d.timer);
  if (!d.on) return;
  suppressClick = true; setTimeout(() => suppressClick = false, 400);
  d.ghost.remove();
  document.body.classList.remove("dragging");
  document.querySelectorAll(".drop,.lifted,.ins-before,.ins-after").forEach(n => n.classList.remove("drop", "lifted", "ins-before", "ins-after"));
  if (commit && d.target) applyDrop(d.n, d.i, d.target, d.pos);
  if (pendingRemote){ pendingRemote = false; applyShared(false); }
  render();
}
function applyDrop(n, i, t, pos){
  const list = rosters[n], src = list[i];
  const zone = t.closest("[data-zone]")?.dataset.zone; if (!zone) return;
  const slots = zoneSlots(n, zone);
  const sameGroup = slots.includes(src.slot);
  const freeIn = () => slots.find(s => slotCount(n, s) < SLOTS[s]);
  if (t.matches(".p[data-i]")){
    const o = list[+t.dataset.i];
    if (!o || o === src) return;
    if (!sameGroup && !freeIn()){                              // full group → swap: he takes the moved player's old spot
      [src.slot, o.slot] = [o.slot, src.slot];
      [src.order, o.order] = [o.order, src.order];
      toast(`${src.name} ⇄ ${o.name}`);
    } else {                                                   // insert before / after the card it was dropped on
      if (!sameGroup) src.slot = slots.includes(o.slot) && slotCount(n, o.slot) < SLOTS[o.slot] ? o.slot : freeIn();
      const g = list.filter(p => slots.includes(p.slot) && p !== src).sort(byOrder);
      g.splice(g.indexOf(o) + (pos === "after" ? 1 : 0), 0, src);
      g.forEach((p, k) => p.order = (k + 1) * 10);
      if (!sameGroup) toast(`${src.name} → ${zone === "full" ? "100%" : LABEL[src.slot]}`);
    }
  } else {                                                     // empty slot / heading → end of that group
    if (sameGroup) return;
    const slot = freeIn();
    if (!slot){ toast(`${LABEL[zone]} is full — drop onto a player to swap`); return; }
    src.slot = slot; src.order = endOrder(n, slots);
    toast(`${src.name} → ${zone === "full" ? "100%" : LABEL[slot]}`);
  }
  fixCaptain(n);
  save(n);
}

boot();
